rt zur kritischen Grenze in σ (Z kritisch).", "tags": ["Measure: Statistik & Prozessfähigkeit"], "flags": []}, {"id": 74, "nr": 74, "module": "Kapitel 3: Measure: Statistik & Prozessfähigkeit", "question": "Was besagt der Sigma-Shift von 1,5σ?", "src": "Measure-Statistik S.78–S.79", "options": [{"key": "a", "text": "Man nimmt an, dass die langfristige Prozessfähigkeit 1,5σ schlechter ist als die kurzfristige", "correct": true}, {"key": "b", "text": "Ein 3σ-Prozess hat mit Shift eine Ausbeute von ca. 93,32 % (≈ 66.800 ppm)", "correct": true}, {"key": "c", "text": "Ein 6σ-Prozess hat mit Shift ca. 3,4 ppm", "correct": true}, {"key": "d", "text": "Ein 6σ-Prozess hat mit Shift ca. 0,002 ppm", "correct": false}], "explanation": "Ohne Shift: 3σ = 2700 ppm, 6σ = 0,002 ppm; mit 1,5σ-Shift: 66.800 bzw. 3,4 ppm.", "tags": ["Measure: Statistik & Prozessfähigkeit"], "flags": []}, {"id": 75, "nr": 75, "module": "Kapitel 3: Measure: Statistik & Prozessfähigkeit", "question": "Welche Werte stehen laut Sigma-Umrechnungstabelle für 4 Sigma?", "src": "Measure-Statistik S.80", "options": [{"key": "a", "text": "Ohne Shift ca. 64 ppm", "correct": true}, {"key": "b", "text": "Mit 1,5σ-Shift ca. 6.210 ppm", "correct": true}, {"key": "c", "text": "Mit Shift ca. 99,379 % Ausbeute", "correct": true}, {"key": "d", "text": "Mit Shift ca. 230 ppm", "correct": false}], "explanation": "4σ: 64 ppm (ohne Shift), 6.210 ppm bzw. 99,379 % (mit Shift); 230 ppm gehört zu 5σ.", "tags": ["Measure: Statistik & Prozessfähigkeit"], "flags": []}, {"id": 76, "nr": 76, "module": "Kapitel 3: Measure: Statistik & Prozessfähigkeit", "question": "Welche Reihenfolge haben die Schritte einer Fähigkeitsuntersuchung?", "src": "Measure-Statistik S.82", "options": [{"key": "a", "text": "Teile entnehmen/messen → zeitliche Stabilität beurteilen → Verteilung untersuchen und Rechenverfahren wählen → Indizes berechnen und Reaktionsplan", "correct": true}, {"key": "b", "text": "Indizes berechnen → Teile messen → Stabilität beurteilen → Verteilung prüfen", "correct": false}, {"key": "c", "text": "Verteilung prüfen → Indizes berechnen → Teile messen → Stabilität beurteilen", "correct": false}, {"key": "d", "text": "Stabilität beurteilen → Indizes berechnen → Verteilung prüfen → Teile messen", "correct": false}], "explanation": "Vier Schritte: Messen, Stabilität, Verteilung/Rechenverfahren, Berechnung + Reaktionsplan.", "tags": ["Measure: Statistik & Prozessfähigkeit"], "flags": []}, {"id": 77, "nr": 77, "module": "Kapitel 3: Measure: Statistik & Prozessfähigkeit", "question": "Welche Aussagen zum Test auf Normalverteilung sind laut Kursunterlage richtig?", "src": "Measure-Statistik S.113–S.114", "options": [{"key": "a", "text": "Die Nullhypothese lautet: Die Daten sind normalverteilt", "correct": true}, {"key": "b", "text": "Bei p ≤ 0,05 gelten die Daten als nicht normalverteilt", "correct": true}, {"key": "c", "text": "Bei p ≤ 0,05 gelten die Daten als normalverteilt", "correct": false}, {"key": "d", "text": "Die Nullhypothese lautet: Die Daten sind nicht normalverteilt", "correct": false}], "explanation": "p > 0,05 → Normalverteilung wird angenommen; p ≤ 0,05 → verwerfen.", "tags": ["Measure: Statistik & Prozessfähigkeit"], "flags": []}, {"id": 78, "nr": 78, "module": "Kapitel 3: Measure: Statistik & Prozessfähigkeit", "question": "Eine grafische Zusammenfassung zeigt beim Anderson-Darling-Test p = 0,442. Was folgt daraus?", "src": "Measure-Statistik S.44 (Anwendung)", "options": [{"key": "a", "text": "Die Daten können als normalverteilt angesehen werden", "correct": true}, {"key": "b", "text": "Die Daten sind signifikant nicht normalverteilt", "correct": false}, {"key": "c", "text": "Der Prozess ist nicht fähig", "correct": false}, {"key": "d", "text": "Die Daten müssen zwingend transformiert werden", "correct": false}], "explanation": "p = 0,442 > 0,05 → die Nullhypothese „normalverteilt“ wird nicht verworfen.", "tags": ["Measure: Statistik & Prozessfähigkeit"], "flags": []}, {"id": 79, "nr": 79, "module": "Kapitel 3: Measure: Statistik & Prozessfähigkeit", "question": "Welche Aussagen zu den Normalitätstests in Minitab sind richtig?", "src": "Measure-Statistik S.115", "options": [{"key": "a", "text": "Anderson-Darling ist der Standardtest und gut bei Auffälligkeiten in den Randbereichen", "correct": true}, {"key": "b", "text": "Ryan-Joiner beruht auf einer Korrelationsberechnung und ist gut im Zentrum der Verteilung", "correct": true}, {"key": "c", "text": "Kolmogorov-Smirnov ist für jede Verteilungsart anwendbar, aber meist wenig effizient", "correct": true}, {"key": "d", "text": "Ryan-Joiner ist der Standardtest in Minitab", "correct": false}], "explanation": "AD = Standard (Ränder), RJ = Korrelation (Zentrum), KS = allgemein, aber wenig effizient.", "tags": ["Measure: Statistik & Prozessfähigkeit"], "flags": []}, {"id": 80, "nr": 80, "module": "Kapitel 3: Measure: Statistik & Prozessfähigkeit", "question": "Welche Methoden werden laut Kursunterlage durch nicht-normalverteilte Daten beeinflusst?", "src": "Measure-Statistik S.100, S.103", "options": [{"key": "a", "text": "Prozessfähigkeit (falsche Cpk-Werte)", "correct": true}, {"key": "b", "text": "Regelkarten (falsche Alarme)", "correct": true}, {"key": "c", "text": "Hypothesentests und DoE (falsche Aussagen bzw. Signifikanzwerte)", "correct": true}, {"key": "d", "text": "Strichlisten", "correct": false}], "explanation": "Prozessfähigkeit, Regelkarten, Hypothesentests, Regression und DoE werden beeinflusst.", "tags": ["Measure: Statistik & Prozessfähigkeit"], "flags": []}, {"id": 81, "nr": 81, "module": "Kapitel 3: Measure: Statistik & Prozessfähigkeit", "question": "Wie geht man laut Kursunterlage mit nicht-normalverteilten Daten um?", "src": "Measure-Statistik S.100, S.104–S.106", "options": [{"key": "a", "text": "Prüfen, ob besondere Einflüsse (zeitliche Veränderungen, Stratifizierung) vorliegen", "correct": true}, {"key": "b", "text": "Den passenden Verteilungstyp identifizieren (z. B. Lognormal)", "correct": true}, {"key": "c", "text": "Wenn keine Verteilung passt, transformieren (z. B. Box-Cox, Johnson)", "correct": true}, {"key": "d", "text": "Die auffälligen Werte grundsätzlich löschen", "correct": false}], "explanation": "Transformationen sind laut Unterlage keine Manipulation, nur eine andere Beschreibungsart der Daten.", "tags": ["Measure: Statistik & Prozessfähigkeit"], "flags": []}, {"id": 82, "nr": 82, "module": "Kapitel 3: Measure: Statistik & Prozessfähigkeit", "question": "Nach welchem Kriterium wird in Minitab beim Bestimmen des Verteilungstyps die passende Verteilung ausgewählt?", "src": "Measure-Statistik S.126", "options": [{"key": "a", "text": "Nach dem größten Korrelationskoeffizienten im Wahrscheinlichkeitsnetz", "correct": true}, {"key": "b", "text": "Nach dem kleinsten Korrelationskoeffizienten", "correct": false}, {"key": "c", "text": "Nach dem größten Cpk", "correct": false}, {"key": "d", "text": "Nach der kleinsten Stichprobengröße", "correct": false}], "explanation": "Je näher die Punkte an der Geraden liegen (höchster Korrelationskoeffizient), desto besser passt der Verteilungstyp.", "tags": ["Measure: Statistik & Prozessfähigkeit"], "flags": []}, {"id": 83, "nr": 83, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Warum sind Messsystemanalysen notwendig?", "src": "MSA S.5–S.7", "options": [{"key": "a", "text": "Richtige Entscheidungen setzen richtige Messwerte voraus", "correct": true}, {"key": "b", "text": "Eine große Streuung des Messprozesses reduziert die beobachtete Prozessfähigkeit", "correct": true}, {"key": "c", "text": "Auch neu kalibrierte Messsysteme können für die Messaufgabe unbrauchbar sein", "correct": true}, {"key": "d", "text": "Weil eine Kalibrierung die MSA vollständig ersetzt", "correct": false}], "explanation": "Die MSA prüft, ob das Messsystem in seiner Umgebung, mit seinen Bedienern und realen Teilen geeignet ist.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 84, "nr": 84, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Wie addieren sich laut Kursunterlage Fertigungs- und Messstreuung?", "src": "MSA S.6", "options": [{"key": "a", "text": "σ²Gesamt = σ²Fertigung + σ²Messung", "correct": true}, {"key": "b", "text": "σGesamt = σFertigung − σMessung", "correct": false}, {"key": "c", "text": "σGesamt = σFertigung · σMessung", "correct": false}, {"key": "d", "text": "σ²Gesamt = σ²Fertigung − σ²Messung", "correct": false}], "explanation": "Die Varianzen addieren sich – deshalb erscheint der Prozess mit schlechtem Messsystem weniger fähig.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 85, "nr": 85, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Was gehört laut Kursunterlage zu einem Messsystem?", "src": "MSA S.8", "options": [{"key": "a", "text": "Messgeräte und weitere Ausrüstung", "correct": true}, {"key": "b", "text": "Verfahren und Ablaufschritte", "correct": true}, {"key": "c", "text": "Personal und Software", "correct": true}, {"key": "d", "text": "Der Kunde des Prozesses", "correct": false}], "explanation": "Das Messsystem umfasst alle Einflusskomponenten: Verfahren, Geräte, Hilfsmittel, Normal, Software und Personal.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 86, "nr": 86, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Welche Begriffsdefinitionen sind richtig?", "src": "MSA S.9", "options": [{"key": "a", "text": "Kalibrieren: Abweichung zu einem bekannt richtigen Standard bestimmen und dokumentieren", "correct": true}, {"key": "b", "text": "Justieren: Die Anzeige des Messgeräts auf den richtigen Wert korrigieren", "correct": true}, {"key": "c", "text": "Eichung: Überprüfung von Messgeräten mit gesetzlichen Vorgaben", "correct": true}, {"key": "d", "text": "Kalibrieren: Die Anzeige des Messgeräts korrigieren", "correct": false}], "explanation": "Kalibrieren stellt die Abweichung fest, Justieren korrigiert sie, Eichen ist die gesetzlich geregelte Prüfung.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 87, "nr": 87, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Was besagt die „Zehn zu eins – Regel“ zur Auflösung?", "src": "MSA S.10–S.11", "options": [{"key": "a", "text": "Die Messeinrichtung sollte mindestens ein Zehntel der Prozessstreuung auflösen können", "correct": true}, {"key": "b", "text": "Die Auflösung muss das Zehnfache der Toleranz betragen", "correct": false}, {"key": "c", "text": "Es müssen zehn Prüfer je ein Teil messen", "correct": false}, {"key": "d", "text": "Die Messung muss zehnmal wiederholt werden", "correct": false}], "explanation": "Faustregel: Ansprechschwelle ≤ 1/10 der zu messenden Streubreite (früher bezogen auf die Toleranz, ≤ 5 %).", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 88, "nr": 88, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Was versteht man unter Genauigkeit („Bias“) eines Messsystems?", "src": "MSA S.12", "options": [{"key": "a", "text": "Die Differenz zwischen dem Mittelwert aller Messungen und dem Referenzwert", "correct": true}, {"key": "b", "text": "Sie wird durch Kalibrierung überprüft", "correct": true}, {"key": "c", "text": "Die Streuung zwischen verschiedenen Prüfern", "correct": false}, {"key": "d", "text": "Die kleinste anzeigbare Änderung", "correct": false}], "explanation": "Bias = systematische Abweichung vom Referenzwert; die Prüferstreuung ist die Vergleichspräzision.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 89, "nr": 89, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Wie wird der cg-Wert laut Kursunterlage berechnet, und welche Forderung ist üblich?", "src": "MSA S.13", "options": [{"key": "a", "text": "cg = 0,2·T / (6·s), häufige Forderung cg > 1,33", "correct": true}, {"key": "b", "text": "cg = T / (6·s), Forderung cg > 1,0", "correct": false}, {"key": "c", "text": "cg = 0,1·T / (3·s), Forderung cg > 2,0", "correct": false}, {"key": "d", "text": "cg = 6·s / (0,2·T), Forderung cg < 1,33", "correct": false}], "explanation": "cg bezieht 20 % der Toleranz auf die 6-fache Wiederholstreuung des Messgeräts.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 90, "nr": 90, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Toleranz T = 0,6 mm, Messgerät-Wiederholstreuung s = 0,01 mm. Wie groß ist cg?", "src": "MSA S.13 (Berechnung)", "options": [{"key": "a", "text": "2,0", "correct": true}, {"key": "b", "text": "1,33", "correct": false}, {"key": "c", "text": "10,0", "correct": false}, {"key": "d", "text": "0,5", "correct": false}], "explanation": "cg = 0,2·0,6 / (6·0,01) = 0,12 / 0,06 = 2,0 → erfüllt cg > 1,33.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 91, "nr": 91, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Was beschreibt der cgk-Wert zusätzlich zum cg-Wert?", "src": "MSA S.14", "options": [{"key": "a", "text": "Die Lage der Streuung der Messwerte (systematische Abweichung zum Referenzwert)", "correct": true}, {"key": "b", "text": "Die Anzahl der unterscheidbaren Kategorien", "correct": false}, {"key": "c", "text": "Die Streuung zwischen den Prüfern", "correct": false}, {"key": "d", "text": "Die Effektivität eines attributiven Systems", "correct": false}], "explanation": "cgk berücksichtigt den Abstand des Mittelwerts xm zum Referenzwert xr (k = katayori); gefordert cgk ≥ 1,33.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 92, "nr": 92, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Welche Definitionen von Wiederhol- und Vergleichspräzision sind richtig?", "src": "MSA S.15–S.16", "options": [{"key": "a", "text": "Wiederholpräzision (Repeatability, EV): gleicher Prüfer, gleiches Messgerät, gleiches Teil, mehrfache Messung", "correct": true}, {"key": "b", "text": "Vergleichspräzision (Reproducibility, AV): Streuung der Mittelwerte durch verschiedene Prüfer mit demselben Gerät", "correct": true}, {"key": "c", "text": "Wiederholpräzision: Streuung zwischen verschiedenen Prüfern", "correct": false}, {"key": "d", "text": "Vergleichspräzision: Abweichung vom Referenzwert", "correct": false}], "explanation": "EV = Streuung innerhalb des Systems; AV = Streuung zwischen den Systemen/Bedingungen.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 93, "nr": 93, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Was ist der GRR-Wert?", "src": "MSA S.18–S.19", "options": [{"key": "a", "text": "Der Schätzwert für die kombinierte Streuung aus Wiederhol- und Vergleichspräzision", "correct": true}, {"key": "b", "text": "Er kann auf die gesamte Prozessstreuung (%R&R) oder auf Toleranz/6 (%P/T) bezogen werden", "correct": true}, {"key": "c", "text": "Die Abweichung des Mittelwertes vom Referenzwert", "correct": false}, {"key": "d", "text": "Die Auflösung des Messgeräts", "correct": false}], "explanation": "Bezug auf Prozessstreuung: kann ich Teile unterscheiden? Bezug auf Toleranz: kann ich gute von schlechten Teilen unterscheiden?", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 94, "nr": 94, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Wie wird ein Messsystem mit %GRR = 22 % laut Faustregel bewertet?", "src": "MSA S.20, S.25", "options": [{"key": "a", "text": "Akzeptabel, abhängig von Wichtigkeit und Kosten der Messung", "correct": true}, {"key": "b", "text": "Sehr gut", "correct": false}, {"key": "c", "text": "Messsystem in Ordnung (< 10 %)", "correct": false}, {"key": "d", "text": "Messsystem erfordert zwingend Korrekturmaßnahmen (> 30 %)", "correct": false}], "explanation": "< 5 % sehr gut, < 10 % in Ordnung, 10–30 % bedingt akzeptabel, > 30 % Korrekturmaßnahmen. (Im Kursbeispiel mit 22 % wurden dennoch Korrekturen empfohlen.)", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 95, "nr": 95, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Welcher Aufbau einer variablen Gage-R&R-Studie ist laut Kursunterlage üblich?", "src": "MSA S.22", "options": [{"key": "a", "text": "10 Teile, 3 Prüfer, 2 oder 3 Wiederholungen (10-3-2 bzw. 10-3-3)", "correct": true}, {"key": "b", "text": "5 Teile, 1 Prüfer, 10 Wiederholungen", "correct": false}, {"key": "c", "text": "30 Teile, 2 Prüfer, 1 Wiederholung", "correct": false}, {"key": "d", "text": "50 Teile, 3 Prüfer, keine Wiederholung", "correct": false}], "explanation": "Typisch 10 Teile, 3 Prüfer, 2–3 Wiederholungen; ANOVA ist die präzisere Auswertemethode.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 96, "nr": 96, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Welche Mindestanzahl eindeutiger Kategorien (ndc) nennt die Kursunterlage?", "src": "MSA S.25", "options": [{"key": "a", "text": "5", "correct": true}, {"key": "b", "text": "2", "correct": false}, {"key": "c", "text": "10", "correct": false}, {"key": "d", "text": "30", "correct": false}], "explanation": "ndc ≥ 5 ist Minimum; im Beispiel kann das Messsystem 6 Kategorien unterscheiden.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 97, "nr": 97, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Welche Auswertungsmöglichkeiten gibt es für attributive Messsysteme?", "src": "MSA S.29", "options": [{"key": "a", "text": "Kappa-Messgröße", "correct": true}, {"key": "b", "text": "Effektivität", "correct": true}, {"key": "c", "text": "%GRR-Wert (Theorie der Signalentdeckung)", "correct": true}, {"key": "d", "text": "Cpk-Wert", "correct": false}], "explanation": "Attributive Systeme (z. B. Gut/Schlecht-Lehre) werden über Kappa, Effektivität oder Signalentdeckung bewertet.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 98, "nr": 98, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Bei einer attributiven MSA wurden 76 von 90 Entscheidungen korrekt getroffen. Wie ist das Messsystem zu bewerten?", "src": "MSA S.30 (Berechnung)", "options": [{"key": "a", "text": "Effektivität ca. 84 % – eingeschränkt annehmbar", "correct": true}, {"key": "b", "text": "Effektivität ca. 84 % – akzeptabel", "correct": false}, {"key": "c", "text": "Effektivität ca. 76 % – nicht akzeptabel", "correct": false}, {"key": "d", "text": "Effektivität ca. 95 % – akzeptabel", "correct": false}], "explanation": "76/90 ≈ 84,4 %. Faustregel: > 90 % akzeptabel, < 80 % nicht akzeptabel, dazwischen eingeschränkt annehmbar.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 99, "nr": 99, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Was bedeutet „Screen % Effective Score vs. Attribute“?", "src": "MSA S.30", "options": [{"key": "a", "text": "Anteil der Entscheidungen, bei denen alle Prüfer in sich und untereinander übereinstimmten UND mit dem Referenznormal übereinstimmten", "correct": true}, {"key": "b", "text": "Anteil der Entscheidungen, bei denen ein Prüfer mit sich selbst übereinstimmte", "correct": false}, {"key": "c", "text": "Anteil der Entscheidungen, bei denen ein Prüfer mit dem Referenznormal übereinstimmte", "correct": false}, {"key": "d", "text": "Anteil der Teile, die als schlecht bewertet wurden", "correct": false}], "explanation": "Appraiser Score = Prüfer mit sich selbst; Score vs. Attribute = Prüfer vs. Referenz; Screen Effective = alle Prüfer einig; vs. Attribute = zusätzlich mit Referenz.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 100, "nr": 100, "module": "Kapitel 4: Measure: Messsystemanalyse (MSA)", "question": "Wie geht man laut Kursunterlage bei einer attributiven MSA (Effektivität) vor?", "src": "MSA S.31", "options": [{"key": "a", "text": "Ca. 30 Teile entnehmen, die sowohl gute als auch schlechte Einheiten enthalten", "correct": true}, {"key": "b", "text": "Prozessspezialisten legen die Referenzentscheidung (gut/schlecht) fest", "correct": true}, {"key": "c", "text": "2 (besser 3) Prüfer bewerten jedes Teil 2 (besser 3) Mal in zufälliger Reihenfolge", "correct": true}, {"key": "d", "text": "Nur gute Teile verwenden, damit das Ergebnis eindeutig ist", "correct": false}], "explanation": "Die Stichprobe muss gute und schlechte Teile enthalten; Teile werden gekennzeichnet und zufällig bewertet.", "tags": ["Measure: Messsystemanalyse (MSA)"], "flags": []}, {"id": 101, "nr": 101, "module": "Kapitel 5: Einführung in Minitab", "question": "Welche Gründe für die Verwendung von Minitab im Training nennt die Kursunterlage?", "src": "Minitab S.3", "options": [{"key": "a", "text": "Grundlegende Analyse-Aufgaben lassen sich einfach lösen", "correct": true}, {"key": "b", "text": "Einfache Handhabung auch für Anfänger", "correct": true}, {"key": "c", "text": "Minitab ist ein Excel-Add-in", "correct": false}, {"key": "d", "text": "Minitab ist die einzige Software für Statistik", "correct": false}], "explanation": "Minitab wurde Ende der 1970er an der Pennsylvania State University entwickelt und ist leicht zu bedienen.", "tags": ["Einführung in Minitab"], "flags": []}, {"id": 102, "nr": 102, "module": "Kapitel 5: Einführung in Minitab", "question": "Welche Aussagen zu den Fenstern in Minitab sind richtig?", "src": "Minitab S.6", "options": [{"key": "a", "text": "Das Sitzungsfenster gibt die Analysen in Textform aus", "correct": true}, {"key": "b", "text": "Das Daten-Fenster ist ein Arbeitsblatt; alles in einer Spalte ist von derselben Art", "correct": true}, {"key": "c", "text": "Das Daten-Fenster ist ein Excel-Spreadsheet", "correct": false}, {"key": "d", "text": "Spaltennamen stehen in der letzten Zeile", "correct": false}], "explanation": "Spaltennamen stehen über der ersten Reihe; das Arbeitsblatt ist kein Excel-Spreadsheet.", "tags": ["Einführung in Minitab"], "flags": []}, {"id": 103, "nr": 103, "module": "Kapitel 5: Einführung in Minitab", "question": "Was bedeuten die Spaltensuffixe im Minitab-Arbeitsblatt?", "src": "Minitab S.7", "options": [{"key": "a", "text": "„T“ steht für Text", "correct": true}, {"key": "b", "text": "„D“ steht für Datum", "correct": true}, {"key": "c", "text": "Kein Suffix bedeutet numerisch", "correct": true}, {"key": "d", "text": "„N“ steht für Normalverteilung", "correct": false}], "explanation": "C1-T = Text, C2-D = Datum, ohne Suffix = numerische Spalte.", "tags": ["Einführung in Minitab"], "flags": []}, {"id": 104, "nr": 104, "module": "Kapitel 5: Einführung in Minitab", "question": "Welche Minitab-Dateitypen sind richtig beschrieben?", "src": "Minitab S.8", "options": [{"key": "a", "text": ".MPJ = Projekt, enthält alle Arbeitsblätter und Auswertungen", "correct": true}, {"key": "b", "text": ".MTW = Arbeitsblatt, kann separat gespeichert werden", "correct": true}, {"key": "c", "text": ".MTW = Projekt mit allen Grafiken", "correct": false}, {"key": "d", "text": ".MPJ = einzelnes Arbeitsblatt", "correct": false}], "explanation": "Ältere Dateien lassen sich mit neueren Versionen öffnen, aber nicht umgekehrt.", "tags": ["Einführung in Minitab"], "flags": []}, {"id": 105, "nr": 105, "module": "Kapitel 5: Einführung in Minitab", "question": "Wofür steht das Tastaturkürzel Strg + E in Minitab?", "src": "Minitab S.9", "options": [{"key": "a", "text": "Öffnet den zuletzt geöffneten Dialog erneut", "correct": true}, {"key": "b", "text": "Wechselt zum nächsten Arbeitsblatt", "correct": false}, {"key": "c", "text": "Exportiert nach Excel", "correct": false}, {"key": "d", "text": "Beendet Minitab", "correct": false}], "explanation": "Strg+E öffnet den letzten Dialog; Strg+D wechselt zwischen Arbeitsblättern eines Projekts.", "tags": ["Einführung in Minitab"], "flags": []}, {"id": 106, "nr": 106, "module": "Kapitel 5: Einführung in Minitab", "question": "Wie werden fehlende Daten in Minitab gekennzeichnet?", "src": "Minitab S.22", "options": [{"key": "a", "text": "Durch einen Stern (*)", "correct": true}, {"key": "b", "text": "Durch eine Null (0)", "correct": false}, {"key": "c", "text": "Durch ein Fragezeichen (?)", "correct": false}, {"key": "d", "text": "Durch eine leere rote Zelle", "correct": false}], "explanation": "Ein * in einer Datenspalte steht für einen fehlenden Wert.", "tags": ["Einführung in Minitab"], "flags": []}, {"id": 107, "nr": 107, "module": "Kapitel 5: Einführung in Minitab", "question": "Was kann eine Ursache für grau unterlegte (inaktive) Menübefehle sein?", "src": "Minitab S.21", "options": [{"key": "a", "text": "Man befindet sich im falschen Minitab-Fenster", "correct": true}, {"key": "b", "text": "Die Dateneingabe ist noch nicht abgeschlossen („Enter“ drücken)", "correct": true}, {"key": "c", "text": "Die Lizenz ist abgelaufen", "correct": false}, {"key": "d", "text": "Die Daten sind normalverteilt", "correct": false}], "explanation": "Grau unterlegte Befehle: falsches Fenster aktiv oder Eingabe noch nicht abgeschlossen.", "tags": ["Einführung in Minitab"], "flags": []}, {"id": 108, "nr": 108, "module": "Kapitel 5: Einführung in Minitab", "question": "Wie fügt man laut Kursunterlage eine Minitab-Grafik platzsparend in PowerPoint ein?", "src": "Minitab S.24", "options": [{"key": "a", "text": "Über „Inhalte einfügen“ (Paste Special) als Bild bzw. Enhanced Metafile", "correct": true}, {"key": "b", "text": "Über einfaches Einfügen, damit Minitab zum Editieren geöffnet wird", "correct": false}, {"key": "c", "text": "Als Minitab-Projektdatei anhängen", "correct": false}, {"key": "d", "text": "Als Screenshot über die Druckfunktion", "correct": false}], "explanation": "Einfaches Einfügen bettet ein editierbares Objekt ein; Paste Special als Bild spart Speicher.", "tags": ["Einführung in Minitab"], "flags": []}, {"id": 109, "nr": 109, "module": "Kapitel 5: Einführung in Minitab", "question": "Was passiert beim Öffnen einer Excel-Arbeitsmappe mit mehreren Blättern in Minitab?", "src": "Minitab S.26", "options": [{"key": "a", "text": "Für jedes Blatt (Tab) wird ein Minitab-Arbeitsblatt erzeugt, ob man es braucht oder nicht", "correct": true}, {"key": "b", "text": "Nur das erste Blatt wird importiert", "correct": false}, {"key": "c", "text": "Alle Blätter werden in einer Spalte zusammengeführt", "correct": false}, {"key": "d", "text": "Der Import ist nicht möglich", "correct": false}], "explanation": "Nicht benötigte Arbeitsblätter löscht man danach; Optionen und Vorschau steuern den Import.", "tags": ["Einführung in Minitab"], "flags": []}, {"id": 110, "nr": 110, "module": "Kapitel 5: Einführung in Minitab", "question": "Welches Menü hieß in Minitab-Versionen vor 14.0 „Manip“?", "src": "Minitab S.13", "options": [{"key": "a", "text": "Das Menü „Daten“", "correct": true}, {"key": "b", "text": "Das Menü „Statistik“", "correct": false}, {"key": "c", "text": "Das Menü „Grafik“", "correct": false}, {"key": "d", "text": "Das Menü „Extras“", "correct": false}], "explanation": "Im Menü „Daten“ (früher „Manip“) werden Spalten kopiert, gestapelt, sortiert und Datentypen geändert.", "tags": ["Einführung in Minitab"], "flags": []}, {"id": 111, "nr": 111, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Welche Aussagen zum Gemba Walk sind laut Kursunterlage richtig?", "src": "Prozesse im Detail S.3–S.4", "options": [{"key": "a", "text": "Gemba bedeutet „der wahre Ort“, an dem die eigentliche Arbeit stattfindet", "correct": true}, {"key": "b", "text": "Das Konzept wurde von Taiichi Ohno (Toyota) entwickelt", "correct": true}, {"key": "c", "text": "Verschwendung lässt sich vom Schreibtisch aus nicht inspizieren", "correct": true}, {"key": "d", "text": "Beim Gemba Walk werden Schuldige für Fehler identifiziert", "correct": false}], "explanation": "Fragen beim Gemba Walk sind neutral – ohne Schuldzuweisung und Tadel; verwandt ist „genchi genbutsu“ (go and see).", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 112, "nr": 112, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Welche sind die 3 Prinzipien des Gemba Walk?", "src": "Prozesse im Detail S.5", "options": [{"key": "a", "text": "Gehen und sehen", "correct": true}, {"key": "b", "text": "Gründe erfragen", "correct": true}, {"key": "c", "text": "Die Menschen respektieren", "correct": true}, {"key": "d", "text": "Ergebnisse der Mitarbeitenden bewerten", "correct": false}], "explanation": "Fokus auf Prozessschwachstellen, nicht auf Menschen; gute Führungskräfte hören lieber zu.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 113, "nr": 113, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Wie verhält man sich laut Praxistipps während eines Gemba Walk?", "src": "Prozesse im Detail S.8–S.9", "options": [{"key": "a", "text": "Beobachtungen aufschreiben, aber keine Lösungsvorschläge während der Beobachtung machen", "correct": true}, {"key": "b", "text": "Dem Team mitteilen, was man gelernt hat – auch wenn nichts Wichtiges gefunden wurde", "correct": true}, {"key": "c", "text": "Eventuell eine Kollegin/einen Kollegen aus einer anderen Abteilung einladen", "correct": true}, {"key": "d", "text": "Sofort Feedback und Lösungen vor Ort geben", "correct": false}], "explanation": "Frühes Feedback kann verheerend sein – die Analyse kommt später.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 114, "nr": 114, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Wie werden ermittelte Verschwendungen laut Kursunterlage bewertet?", "src": "Prozesse im Detail S.7", "options": [{"key": "a", "text": "Anhand von Daten quantifizieren, möglichst in EUR", "correct": true}, {"key": "b", "text": "Laufwege × Häufigkeit × relevante Lohnkosten berechnen", "correct": true}, {"key": "c", "text": "Mit einer Pareto-Analyse die wichtigsten Verschwendungsquellen identifizieren", "correct": true}, {"key": "d", "text": "Nur qualitativ nach Bauchgefühl", "correct": false}], "explanation": "Vorher wird eine Checkliste erstellt; danach wird Verschwendung quantifiziert und priorisiert.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 115, "nr": 115, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Was ist eine Wertstromanalyse laut Kursunterlage?", "src": "Prozesse im Detail S.11–S.12", "options": [{"key": "a", "text": "Material- und Informationsflüsse werden vom Endprodukt bis zu den Lieferanten abgebildet", "correct": true}, {"key": "b", "text": "Sie wird für jede Produktfamilie separat angewandt", "correct": true}, {"key": "c", "text": "Sie beginnt immer mit dem Bedarf des Endkunden", "correct": true}, {"key": "d", "text": "Sie bildet exakt das Werkslayout ab", "correct": false}], "explanation": "Das Wertstromdesign unterscheidet sich in der Regel vom Werkslayout und beginnt auf „Rampe-zu-Rampe-Ebene“.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 116, "nr": 116, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Wie wird der Linewalk bei der Wertstromanalyse durchgeführt?", "src": "Prozesse im Detail S.16, S.21", "options": [{"key": "a", "text": "Als Schnellbegehung vor Ort flussaufwärts, beim Kunden beginnend", "correct": true}, {"key": "b", "text": "Mit Ist-Datenerfassung statt Plan- oder Systemdaten", "correct": true}, {"key": "c", "text": "Zeitaufnahmen vorher mit dem Betriebsrat abstimmen", "correct": true}, {"key": "d", "text": "Vom Lieferanten beginnend flussabwärts anhand der Systemdaten", "correct": false}], "explanation": "Die Prozesskette wird möglichst an einem Stück rückwärts durchlaufen.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 117, "nr": 117, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Welche Daten werden bei der Prozessaufnahme für die Wertstromanalyse erhoben?", "src": "Prozesse im Detail S.22, S.25", "options": [{"key": "a", "text": "Zykluszeit/Taktzeit und Rüstzeiten", "correct": true}, {"key": "b", "text": "Losgrößen und Anzahl Mitarbeitende je Prozessschritt", "correct": true}, {"key": "c", "text": "Tatsächliche Kundenbedarfe", "correct": true}, {"key": "d", "text": "Die Lieblingsfarbe der Kunden", "correct": false}], "explanation": "Dazu kommen u. a. Behältergröße, Nutzungsgrad, verfügbare Arbeitszeit, Logistikschritte, Kaizen-Blitze, Überstunden.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 118, "nr": 118, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Wie werden Bestände in der Wertstromanalyse dargestellt?", "src": "Prozesse im Detail S.28", "options": [{"key": "a", "text": "Mit einem „Warndreieck“ mit dem Buchstaben „I“ (Inventory)", "correct": true}, {"key": "b", "text": "Mit einem Blitzsymbol", "correct": false}, {"key": "c", "text": "Mit einem LKW-Symbol", "correct": false}, {"key": "d", "text": "Mit einem Brillen-Symbol („Go See“)", "correct": false}], "explanation": "Unter dem Bestandsdreieck stehen Bestandsmenge und Durchlaufzeit; der Kaizen-Blitz markiert Probleme.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 119, "nr": 119, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Vor einem Prozess liegen 10 Coils; der nachfolgende Prozess benötigt 5 Coils pro Tag. Welche Durchlaufzeit wird beim Bestandsdreieck angegeben?", "src": "Prozesse im Detail S.28 (Berechnung)", "options": [{"key": "a", "text": "2 Tage", "correct": true}, {"key": "b", "text": "0,5 Tage", "correct": false}, {"key": "c", "text": "5 Tage", "correct": false}, {"key": "d", "text": "50 Tage", "correct": false}], "explanation": "DLZ = Bestandsmenge / täglicher Kundenbedarf (Kunde = nachfolgender Prozess) = 10/5 = 2 Tage.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 120, "nr": 120, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Wie wird die Gesamtdurchlaufzeit im Wertstrom ermittelt?", "src": "Prozesse im Detail S.29", "options": [{"key": "a", "text": "Addition der Durchlaufzeiten in jedem Prozess und in jedem Bestandsdreieck", "correct": true}, {"key": "b", "text": "Nur die Summe der Bearbeitungszeiten der Prozesse", "correct": false}, {"key": "c", "text": "Nur die längste Einzelzeit", "correct": false}, {"key": "d", "text": "Durchschnitt der Bestandsliegezeiten", "correct": false}], "explanation": "Über die Zeitlinie werden Prozess- und Liegezeiten addiert.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 121, "nr": 121, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Welche Formeln nennt die Kursunterlage für Flussfaktor und Durchlaufzeit?", "src": "Prozesse im Detail S.31", "options": [{"key": "a", "text": "Flussfaktor FF = DLZ / physikalische DLZ (PDLZ)", "correct": true}, {"key": "b", "text": "DLZ = WIP (Bestände) / Durchsatz pro Zeit (DPZ)", "correct": true}, {"key": "c", "text": "DLZ = Durchsatz pro Zeit / WIP", "correct": false}, {"key": "d", "text": "FF = PDLZ / DLZ", "correct": false}], "explanation": "FF zeigt, um wie viel die tatsächliche DLZ länger ist als die reine Bearbeitungszeit; DLZ = Bestand/Durchsatz.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 122, "nr": 122, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "In einem Prozess befinden sich 200 Teile im Umlauf (WIP); der Durchsatz beträgt 50 Teile pro Tag. Die physikalische Durchlaufzeit beträgt 0,5 Tage. Welche Aussagen stimmen?", "src": "Prozesse im Detail S.31 (Berechnung)", "options": [{"key": "a", "text": "DLZ = 4 Tage", "correct": true}, {"key": "b", "text": "Flussfaktor = 8", "correct": true}, {"key": "c", "text": "DLZ = 0,25 Tage", "correct": false}, {"key": "d", "text": "Flussfaktor = 0,125", "correct": false}], "explanation": "DLZ = 200/50 = 4 Tage; FF = 4/0,5 = 8.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 123, "nr": 123, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Was zeigt der Informationsfluss im Wertstromdesign?", "src": "Prozesse im Detail S.33", "options": [{"key": "a", "text": "Woher jeder Prozess weiß, was, wann und wieviel er produzieren soll", "correct": true}, {"key": "b", "text": "Wie viel Material zwischen den Prozessen liegt", "correct": false}, {"key": "c", "text": "Wie lange der Transport dauert", "correct": false}, {"key": "d", "text": "Welche Mitarbeitenden welche Qualifikation haben", "correct": false}], "explanation": "Neben dem Materialfluss ist der Informationsfluss der zweite Aspekt des Wertstromdesigns.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 124, "nr": 124, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Was hat sich laut Kursunterlage bei der Wertstromanalyse in der Praxis bewährt?", "src": "Prozesse im Detail S.34", "options": [{"key": "a", "text": "Haftnotizen auf einer Tapete", "correct": true}, {"key": "b", "text": "Farbliche und symbolische Kodierung", "correct": true}, {"key": "c", "text": "Der NICHT-Einsatz des PCs bei der Aufnahme", "correct": true}, {"key": "d", "text": "Ausschließlich die Aufnahme direkt in Visio am Laptop", "correct": false}], "explanation": "Die Tapete kann mitgenommen werden; die Dokumentation erfolgt später z. B. in PowerPoint/Visio.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 125, "nr": 125, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Berechne den Kundentakt: 240 Arbeitstage/Jahr, 7,7 h verfügbare Arbeitszeit je Schicht, 1 Schicht, Kundenbedarf 540 Stück/Jahr.", "src": "Prozesse im Detail S.39 (Berechnung)", "options": [{"key": "a", "text": "ca. 3,4 Stunden pro Stück", "correct": true}, {"key": "b", "text": "ca. 0,29 Stunden pro Stück", "correct": false}, {"key": "c", "text": "ca. 2,25 Stunden pro Stück", "correct": false}, {"key": "d", "text": "ca. 7,7 Stunden pro Stück", "correct": false}], "explanation": "KT = (240 · 7,7 · 1) / 540 = 1848 / 540 ≈ 3,4 h.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 126, "nr": 126, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Welche Zuordnungen zum Kundentakt sind laut Kursunterlage richtig?", "src": "Prozesse im Detail S.39", "options": [{"key": "a", "text": "Wer langsamer als der Kundentakt ist, ist überlastet (Muri) und gefährdet die Lieferung", "correct": true}, {"key": "b", "text": "Wer schneller als der Kundentakt ist, erzeugt Überproduktion, Bestände, Warten (Muda)", "correct": true}, {"key": "c", "text": "Ausrichtung aller Ressourcen auf den Kundentakt vermeidet Unausgeglichenheit (Mura)", "correct": true}, {"key": "d", "text": "Der Kundentakt ist die Summe aller Bearbeitungszeiten", "correct": false}], "explanation": "Mura = Unausgeglichenheit, Muri = Überlastung, Muda = Verschwendung.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 127, "nr": 127, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Welche Voraussetzungen bzw. Ergebnisse hat der One-Piece-Flow (kontinuierlicher Fluss)?", "src": "Prozesse im Detail S.41", "options": [{"key": "a", "text": "Prozesse sollten annähernd gleiche Zykluszeiten haben", "correct": true}, {"key": "b", "text": "Ergebnis: kürzeste Durchlaufzeit und sofortige Fehlererkennung", "correct": true}, {"key": "c", "text": "Stabile Prozesse sind notwendig", "correct": true}, {"key": "d", "text": "Hohe Bestände zwischen den Prozessen", "correct": false}], "explanation": "Im One-Piece-Flow sind Prozesse ohne Bestände dazwischen in Sequenz verbunden.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 128, "nr": 128, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Was kennzeichnet einen Supermarkt im Pull-System laut Kursunterlage?", "src": "Prozesse im Detail S.43–S.44", "options": [{"key": "a", "text": "Materialpuffer, wo kein kontinuierlicher Fluss möglich ist, mit festgelegten Min- und Max-Mengen", "correct": true}, {"key": "b", "text": "Steuerung über Kanban; Nachproduktion nur, wenn der Verbraucher Teile entnimmt", "correct": true}, {"key": "c", "text": "Er soll in der Nähe des Verbrauchers platziert werden", "correct": true}, {"key": "d", "text": "Unbegrenzte Bestände zur Absicherung", "correct": false}], "explanation": "Beispiel Rollenlager: der leere Behälter dient als Kanbansignal.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 129, "nr": 129, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Was ist Kanban und wozu wird es eingesetzt?", "src": "Prozesse im Detail S.45", "options": [{"key": "a", "text": "Japanisch für „Karte“; eine vom Verbraucher ausgelöste Material- und Bestandssteuerung", "correct": true}, {"key": "b", "text": "Ziel: regelmäßige Materialversorgung bei niedrigen Beständen", "correct": true}, {"key": "c", "text": "Eine Methode zur Messsystemanalyse", "correct": false}, {"key": "d", "text": "Eine vom Lieferanten nach Plan ausgelöste Push-Steuerung", "correct": false}], "explanation": "Jede Karte steht für eine bestimmte Menge eines bestimmten Materials.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 130, "nr": 130, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Was ist der Unterschied zwischen Einzelzeit und Fortschrittszeit bei Zeitstudien?", "src": "Prozesse im Detail S.49", "options": [{"key": "a", "text": "Einzelzeit ist die Dauer eines einzelnen Prozessschrittes", "correct": true}, {"key": "b", "text": "Fortschrittszeiten sind die Zeitpunkte der Endereignisse bei fortlaufender Messung seit Beginn", "correct": true}, {"key": "c", "text": "Fortschrittszeit ist die Dauer eines einzelnen Schrittes", "correct": false}, {"key": "d", "text": "Einzelzeit ist die Gesamtzeit aller Schritte", "correct": false}], "explanation": "Beispiel: tf1 = 2:34, tf2 = 5:57 → Einzelzeit t2 = 3:23.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 131, "nr": 131, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Bei einer Zeitaufnahme werden die Fortschrittszeiten 00:02:34 und 00:05:57 gemessen. Wie lange dauert der zweite Prozessschritt?", "src": "Prozesse im Detail S.49 (Berechnung)", "options": [{"key": "a", "text": "3 min 23 s", "correct": true}, {"key": "b", "text": "2 min 34 s", "correct": false}, {"key": "c", "text": "5 min 57 s", "correct": false}, {"key": "d", "text": "8 min 31 s", "correct": false}], "explanation": "Einzelzeit t2 = tf2 − tf1 = 5:57 − 2:34 = 3:23.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 132, "nr": 132, "module": "Kapitel 6: Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)", "question": "Welches Werkzeug visualisiert die Laufwege von Mitarbeitenden bzw. Material?", "src": "Prozesse im Detail S.52–S.53", "options": [{"key": "a", "text": "Spaghetti-Diagramm", "correct": true}, {"key": "b", "text": "Paretodiagramm", "correct": false}, {"key": "c", "text": "Boxplot", "correct": false}, {"key": "d", "text": "Kräftefeldanalyse", "correct": false}], "explanation": "Wegmessungen werden im Spaghetti-Diagramm dargestellt und machen unnötige Bewegung/Transport sichtbar.", "tags": ["Prozesse im Detail verstehen (Gemba, Wertstrom, Zeitstudien)"], "flags": []}, {"id": 133, "nr": 133, "module": "Kapitel 7: Analyze-Phase", "question": "Was ist das Ziel der Analyze-Phase laut Kursunterlage?", "src": "Analyze S.2", "options": [{"key": "a", "text": "Mögliche Einflüsse ermitteln und relevante Einflussgrößen identifizieren", "correct": true}, {"key": "b", "text": "Wirkzusammenhänge quantifizieren (physikalisch, chemisch …)", "correct": true}, {"key": "c", "text": "Lösungen standardisieren und absichern", "correct": false}, {"key": "d", "text": "Den Projektumfang abklären", "correct": false}], "explanation": "Analyze: von möglichen Einflüssen zu den relevanten x „in die Tiefe bohren“ und Ursache-Wirkung quantifizieren.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 134, "nr": 134, "module": "Kapitel 7: Analyze-Phase", "question": "Wovon geht man beim Ishikawa-Diagramm laut Kursunterlage aus?", "src": "Analyze S.4", "options": [{"key": "a", "text": "Von den 6 M als Hauptursachen", "correct": true}, {"key": "b", "text": "Von den 8 Verschwendungsarten", "correct": false}, {"key": "c", "text": "Von den 5 Lean-Prinzipien", "correct": false}, {"key": "d", "text": "Von den DMAIC-Phasen", "correct": false}], "explanation": "Ausgehend von den 6 M (z. B. Mensch, Maschine, Methode, Material, Mitwelt, Management) werden Ursachen als Unteräste erfasst.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 135, "nr": 135, "module": "Kapitel 7: Analyze-Phase", "question": "Welche Spalten enthält die Hypothesenliste laut Kursunterlage?", "src": "Analyze S.5", "options": [{"key": "a", "text": "Verbale Beschreibung der Hypothese (vermuteter Wirkmechanismus)", "correct": true}, {"key": "b", "text": "Auswertungsansatz (wie wird die Hypothese bewiesen?)", "correct": true}, {"key": "c", "text": "Gewonnene Erkenntnisse", "correct": true}, {"key": "d", "text": "Verantwortlicher Lieferant", "correct": false}], "explanation": "Dazu kommen Nr. und erklärende Skizzen.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 136, "nr": 136, "module": "Kapitel 7: Analyze-Phase", "question": "Welche Regeln gelten bei der 5x-Warum-Methode?", "src": "Analyze S.12–S.13", "options": [{"key": "a", "text": "Keine Annahmen treffen – Fakten bei den Prozessbeteiligten erfragen", "correct": true}, {"key": "b", "text": "Nicht zu früh aufhören, sondern weiterfragen", "correct": true}, {"key": "c", "text": "Überprüfung durch Umkehrung der Frage (Wenn-dann-Feststellung)", "correct": true}, {"key": "d", "text": "Genau fünfmal fragen, nie öfter oder seltener", "correct": false}], "explanation": "Zielt die Antwort auf einen fehlerhaften oder fehlenden Prozess, ist man oft an der Wurzel angekommen.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 137, "nr": 137, "module": "Kapitel 7: Analyze-Phase", "question": "Im Beispiel „Die Anlage ist ausgefallen“ war das Lager nicht im Schmierplan enthalten. Welche Lösung adressiert die Wurzel des Problems?", "src": "Analyze S.9", "options": [{"key": "a", "text": "Lager in den Schmierplan aufnehmen und den Schmierplan auf Vollständigkeit kontrollieren", "correct": true}, {"key": "b", "text": "Motor austauschen", "correct": false}, {"key": "c", "text": "Lager reparieren", "correct": false}, {"key": "d", "text": "Lager einmalig schmieren", "correct": false}], "explanation": "Die anderen Maßnahmen bekämpfen nur Symptome bzw. Zwischenursachen.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 138, "nr": 138, "module": "Kapitel 7: Analyze-Phase", "question": "Welche drei Prozesse untersucht die Sonderform „3x 5x Warum“?", "src": "Analyze S.14", "options": [{"key": "a", "text": "Produktplanungsprozess (Entwicklung)", "correct": true}, {"key": "b", "text": "Herstellprozess (Fertigung)", "correct": true}, {"key": "c", "text": "Überwachungsprozess", "correct": true}, {"key": "d", "text": "Beschaffungsprozess", "correct": false}], "explanation": "Warum nicht verhindert (Entwicklung), nicht vermieden (Fertigung), nicht erkannt (Überwachung)?", "tags": ["Analyze-Phase"], "flags": []}, {"id": 139, "nr": 139, "module": "Kapitel 7: Analyze-Phase", "question": "Welche Aussagen zu Arten von Wirkzusammenhängen sind richtig?", "src": "Analyze S.19", "options": [{"key": "a", "text": "White-Box: physikalische Modellbildung anhand von Naturgesetzen und Systemwissen", "correct": true}, {"key": "b", "text": "Black-Box: empirische Modellbildung mit mathematischem Ansatz und Parameterbestimmung durch Versuche (DoE)", "correct": true}, {"key": "c", "text": "White-Box: Modell rein aus Versuchsdaten ohne Systemwissen", "correct": false}, {"key": "d", "text": "Black-Box: Ableitung ausschließlich aus Naturgesetzen", "correct": false}], "explanation": "Beispiel White-Box: σ = −E·α·ΔT; Black-Box: y = b0 + b1x1 + b2x2 + …", "tags": ["Analyze-Phase"], "flags": []}, {"id": 140, "nr": 140, "module": "Kapitel 7: Analyze-Phase", "question": "Was sind Null- und Alternativhypothese laut Kursunterlage?", "src": "Analyze S.22", "options": [{"key": "a", "text": "Nullhypothese: i. d. R. „Es besteht kein Unterschied, Werte sind gleich“", "correct": true}, {"key": "b", "text": "Alternativhypothese: das Gegenteil der Nullhypothese", "correct": true}, {"key": "c", "text": "Die Alternativhypothese wird erst angenommen, wenn dies mit ausreichender Sicherheit geschieht", "correct": true}, {"key": "d", "text": "Die Nullhypothese wird nur bei p < 0,05 angenommen", "correct": false}], "explanation": "H0 wird beibehalten, solange H1 nicht mit ausreichender Sicherheit angenommen werden kann.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 141, "nr": 141, "module": "Kapitel 7: Analyze-Phase", "question": "Ein t-Test liefert p = 0,312 bei einem Signifikanzniveau von 5 %. Welche Aussagen stimmen?", "src": "Analyze S.23, S.44", "options": [{"key": "a", "text": "Die Nullhypothese kann nicht verworfen werden", "correct": true}, {"key": "b", "text": "Die Irrtumswahrscheinlichkeit bei Verwerfung von H0 betrüge 31,2 %", "correct": true}, {"key": "c", "text": "Es besteht ein signifikanter Unterschied", "correct": false}, {"key": "d", "text": "Die Alternativhypothese ist bewiesen", "correct": false}], "explanation": "p > 0,05 → H0 beibehalten; die Indizien reichen nicht für einen signifikanten Unterschied.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 142, "nr": 142, "module": "Kapitel 7: Analyze-Phase", "question": "Was ist ein Fehler 1. Art (α-Fehler)?", "src": "Analyze S.25, S.27", "options": [{"key": "a", "text": "Die Nullhypothese wird zurückgewiesen, obwohl sie wahr ist („Fehlalarm“)", "correct": true}, {"key": "b", "text": "Beispiel: Eine normale E-Mail wird fälschlich als Spam klassifiziert", "correct": true}, {"key": "c", "text": "Die Nullhypothese wird beibehalten, obwohl die Alternativhypothese richtig ist", "correct": false}, {"key": "d", "text": "Beispiel: Eine Spam-Mail wird nicht als Spam erkannt", "correct": false}], "explanation": "Fehler 1. Art = falsch-positiv (Fehlalarm); Fehler 2. Art = falsch-negativ (unterlassener Alarm).", "tags": ["Analyze-Phase"], "flags": []}, {"id": 143, "nr": 143, "module": "Kapitel 7: Analyze-Phase", "question": "Was ist ein Fehler 2. Art (β-Fehler)?", "src": "Analyze S.26–S.27", "options": [{"key": "a", "text": "Die Nullhypothese wird nicht abgelehnt, obwohl die Alternativhypothese korrekt ist", "correct": true}, {"key": "b", "text": "Er wird auch „unterlassener Alarm“ genannt", "correct": true}, {"key": "c", "text": "Seine Wahrscheinlichkeit lässt sich meist nicht berechnen", "correct": true}, {"key": "d", "text": "Seine Wahrscheinlichkeit wird als 1−β bezeichnet", "correct": false}], "explanation": "1−β ist die Power (Sensitivität) – die Wahrscheinlichkeit, einen echten Unterschied zu erkennen.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 144, "nr": 144, "module": "Kapitel 7: Analyze-Phase", "question": "Welcher Test passt laut Testauswahlmatrix (x und y) zu welcher Datensituation?", "src": "Analyze S.34", "options": [{"key": "a", "text": "x diskret, y stetig: Tests wie t-Test, ANOVA", "correct": true}, {"key": "b", "text": "x stetig, y stetig: Korrelation, Regression", "correct": true}, {"key": "c", "text": "x diskret, y diskret: Chi-Quadrat", "correct": true}, {"key": "d", "text": "x stetig, y diskret: ANOVA", "correct": false}], "explanation": "x stetig/y diskret → logistische Regression.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 145, "nr": 145, "module": "Kapitel 7: Analyze-Phase", "question": "Wann verwendet man den Z-Test statt des One-sample t-Tests beim Vergleich eines Mittelwerts mit einem Sollwert?", "src": "Analyze S.40", "options": [{"key": "a", "text": "Wenn die Standardabweichung der Grundgesamtheit bekannt ist", "correct": true}, {"key": "b", "text": "Wenn die Standardabweichung der Grundgesamtheit nicht bekannt ist", "correct": false}, {"key": "c", "text": "Wenn die Daten nicht normalverteilt sind", "correct": false}, {"key": "d", "text": "Wenn mehr als zwei Gruppen verglichen werden", "correct": false}], "explanation": "Beide Tests setzen Normalverteilung voraus; t-Test bei unbekanntem, Z-Test bei bekanntem σ.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 146, "nr": 146, "module": "Kapitel 7: Analyze-Phase", "question": "Welchen Test wählt man zum Vergleich von Mittelwerten, wenn y nicht normalverteilt ist?", "src": "Analyze S.47", "options": [{"key": "a", "text": "2 Mittelwerte: Mann-Whitney-Test", "correct": true}, {"key": "b", "text": "Mehrere Mittelwerte: Kruskal-Wallis-Test", "correct": true}, {"key": "c", "text": "2 Mittelwerte: t-Test", "correct": false}, {"key": "d", "text": "Mehrere Mittelwerte: einfache Varianzanalyse", "correct": false}], "explanation": "Bei Normalverteilung: t-Test bzw. einfache ANOVA; verteilungsunabhängig: Mann-Whitney bzw. Kruskal-Wallis.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 147, "nr": 147, "module": "Kapitel 7: Analyze-Phase", "question": "Welche Voraussetzungen hat der 2-Stichproben-t-Test laut Kursunterlage?", "src": "Analyze S.51", "options": [{"key": "a", "text": "Normalverteilte Merkmale", "correct": true}, {"key": "b", "text": "Gleiche Varianzen", "correct": true}, {"key": "c", "text": "Vorher Test auf Normalverteilung und auf gleiche Varianzen durchführen", "correct": true}, {"key": "d", "text": "Mindestens 5 Gruppen", "correct": false}], "explanation": "Der t-Test ist mäßig empfindlich gegenüber Abweichungen von der Normalverteilung.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 148, "nr": 148, "module": "Kapitel 7: Analyze-Phase", "question": "Wann wendet man einen einseitigen t-Test an?", "src": "Analyze S.52", "options": [{"key": "a", "text": "Wenn die Richtung des Unterschieds vorhergesagt werden kann", "correct": true}, {"key": "b", "text": "Wenn die Richtung keine Rolle spielt", "correct": false}, {"key": "c", "text": "Wenn mehr als zwei Mittelwerte verglichen werden", "correct": false}, {"key": "d", "text": "Wenn die Daten diskret sind", "correct": false}], "explanation": "Beispiel: Ein modifiziertes Schweißgerät müsste mehr Ausstoß haben als das alte → einseitig.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 149, "nr": 149, "module": "Kapitel 7: Analyze-Phase", "question": "Welcher Test zum Vergleich von Varianzen ist laut Kursunterlage richtig zugeordnet?", "src": "Analyze S.56–S.57", "options": [{"key": "a", "text": "2 Varianzen, normalverteilt: F-Test", "correct": true}, {"key": "b", "text": "Mehrere Varianzen, normalverteilt: Bartlett's Test", "correct": true}, {"key": "c", "text": "Verteilungsunabhängig: Levene's Test", "correct": true}, {"key": "d", "text": "Mehrere Varianzen, normalverteilt: Kruskal-Wallis", "correct": false}], "explanation": "F-Test (2 Gruppen) und Bartlett (mehrere) setzen Normalverteilung voraus; Levene nicht.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 150, "nr": 150, "module": "Kapitel 7: Analyze-Phase", "question": "Beim Test auf gleiche Varianzen ergeben sich: F-Test p = 0,047, Levene p = 0,099. Die Daten sind normalverteilt. Was folgt?", "src": "Analyze S.60", "options": [{"key": "a", "text": "Der F-Test ist maßgeblich; die Varianzen sind als ungleich anzunehmen", "correct": true}, {"key": "b", "text": "Der Levene-Test ist maßgeblich; die Varianzen sind gleich", "correct": false}, {"key": "c", "text": "Beide Tests zeigen gleiche Varianzen", "correct": false}, {"key": "d", "text": "Es ist keine Aussage möglich", "correct": false}], "explanation": "Normalverteilte Daten → F-Test verwenden; p < 0,05 → Ungleichheit der Varianzen.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 151, "nr": 151, "module": "Kapitel 7: Analyze-Phase", "question": "Welche Aussagen zur einfachen ANOVA sind richtig?", "src": "Analyze S.65, S.69", "options": [{"key": "a", "text": "Sie prüft, ob ein Unterschied zwischen den Mittelwerten von zwei oder mehr Gruppen besteht", "correct": true}, {"key": "b", "text": "H1: Zumindest ein Mittelwert unterscheidet sich von den anderen", "correct": true}, {"key": "c", "text": "Voraussetzungen: unabhängige Datenreihen, Normalverteilung, gleiche Varianzen", "correct": true}, {"key": "d", "text": "p < 0,05 bedeutet, dass alle Mittelwerte gleich sind", "correct": false}], "explanation": "Bei gleichem Umfang der Datenreihen sind Normalverteilung und gleiche Varianzen vernachlässigbar.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 152, "nr": 152, "module": "Kapitel 7: Analyze-Phase", "question": "Was ist das R-Quadrat (Bestimmtheitsmaß)?", "src": "Analyze S.70, S.77", "options": [{"key": "a", "text": "Der Prozentsatz der Streuung der Antwortvariablen, der durch das Modell erklärt wird", "correct": true}, {"key": "b", "text": "Es liegt zwischen 0 und 100 %; in der Praxis sollte R² > 80 % erreicht werden", "correct": true}, {"key": "c", "text": "Die Wahrscheinlichkeit für einen Fehler 1. Art", "correct": false}, {"key": "d", "text": "Die Steigung der Regressionsgeraden", "correct": false}], "explanation": "R² = erklärte Streuung / Gesamtstreuung.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 153, "nr": 153, "module": "Kapitel 7: Analyze-Phase", "question": "Wann gilt laut Kursunterlage eine Grundursache (Root Cause) als bestätigt?", "src": "Analyze S.74", "options": [{"key": "a", "text": "Wenn eine statistisch signifikante Beziehung zur Wirkung besteht UND das Prozesswissen den kausalen Zusammenhang untermauert", "correct": true}, {"key": "b", "text": "Wenn eine statistisch signifikante Beziehung besteht (allein ausreichend)", "correct": false}, {"key": "c", "text": "Wenn ein hoher Korrelationskoeffizient vorliegt", "correct": false}, {"key": "d", "text": "Wenn das Team sich einig ist", "correct": false}], "explanation": "Beide Bedingungen müssen erfüllt sein; ein mathematischer Zusammenhang allein beweist keine Ursache.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 154, "nr": 154, "module": "Kapitel 7: Analyze-Phase", "question": "Auf welchem Prinzip beruht die lineare Regression?", "src": "Analyze S.75", "options": [{"key": "a", "text": "Methode der kleinsten Quadrate (nach C. F. Gauß)", "correct": true}, {"key": "b", "text": "Methode der größten Abweichung", "correct": false}, {"key": "c", "text": "Pareto-Prinzip", "correct": false}, {"key": "d", "text": "Randomisierung", "correct": false}], "explanation": "Die Gerade wird so eingepasst, dass die Summe der quadrierten Abstände minimal wird.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 155, "nr": 155, "module": "Kapitel 7: Analyze-Phase", "question": "Ausschussrate = 4,3 + 12,7 · Maschinengeschwindigkeit. Um wie viel ändert sich die Ausschussrate, wenn die Geschwindigkeit um 2 Einheiten steigt?", "src": "Analyze S.76 (Berechnung)", "options": [{"key": "a", "text": "Um 25,4 Einheiten", "correct": true}, {"key": "b", "text": "Um 12,7 Einheiten", "correct": false}, {"key": "c", "text": "Um 4,3 Einheiten", "correct": false}, {"key": "d", "text": "Um 29,7 Einheiten", "correct": false}], "explanation": "Die Steigung (12,7) gibt die Änderung von y je Einheit x an: 2 · 12,7 = 25,4.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 156, "nr": 156, "module": "Kapitel 7: Analyze-Phase", "question": "Welche Punkte sind bei der multiplen Regression laut Kursunterlage zu beachten?", "src": "Analyze S.80–S.81", "options": [{"key": "a", "text": "Die Inputfaktoren dürfen nicht stark korreliert sein (Prüfung z. B. über VIF)", "correct": true}, {"key": "b", "text": "Die Anzahl der Messungen sollte größer als 50 + Anzahl der Prädiktoren sein", "correct": true}, {"key": "c", "text": "Vorsicht bei Extrapolation – das Modell gilt nur im Bereich der Messwerte", "correct": true}, {"key": "d", "text": "Je mehr korrelierte Inputs, desto besser das Modell", "correct": false}], "explanation": "Je größer der VIF, desto stärker die Korrelation mit anderen Termen.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 157, "nr": 157, "module": "Kapitel 7: Analyze-Phase", "question": "Im Regressionsbeispiel hat „Konzentration HNO3“ einen p-Wert von 0,344. Was ist laut Kursunterlage zu tun?", "src": "Analyze S.83–S.84", "options": [{"key": "a", "text": "Der Koeffizient ist nicht signifikant; das Modell ohne diesen Term erneut rechnen", "correct": true}, {"key": "b", "text": "Der Faktor ist hoch signifikant und muss im Modell bleiben", "correct": false}, {"key": "c", "text": "Das gesamte Modell verwerfen", "correct": false}, {"key": "d", "text": "Die Daten transformieren", "correct": false}], "explanation": "H0: Koeffizient = 0; p > 0,05 → nicht signifikant. Das reduzierte Modell hat R² 90,9 % statt 91,4 %.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 158, "nr": 158, "module": "Kapitel 7: Analyze-Phase", "question": "Welche Aussagen zur Residuenanalyse sind richtig?", "src": "Analyze S.87–S.88", "options": [{"key": "a", "text": "Ein Residuum ist der Abstand des Messwertes von der Modellkurve", "correct": true}, {"key": "b", "text": "Die Residuen sollten normalverteilt sein", "correct": true}, {"key": "c", "text": "Im zeitlichen Verlauf und gegen gefittete Werte sollte kein Muster erkennbar sein", "correct": true}, {"key": "d", "text": "Residuen sollten mit der Zeit einen Trend zeigen", "correct": false}], "explanation": "Muster in den Residuen deuten auf systematische Einflüsse hin, die das Modell nicht abbildet.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 159, "nr": 159, "module": "Kapitel 7: Analyze-Phase", "question": "Wie verhält sich das Prognoseintervall (PI) bei der Anpassungslinie?", "src": "Analyze S.86", "options": [{"key": "a", "text": "Es wird breiter, je weiter der Punkt von den vorhandenen Messwerten entfernt ist", "correct": true}, {"key": "b", "text": "Es ist immer schmaler als das Konfidenzintervall der Geraden", "correct": false}, {"key": "c", "text": "Es ist über den ganzen Bereich konstant", "correct": false}, {"key": "d", "text": "Es beschreibt nur den Mittelwert der Daten", "correct": false}], "explanation": "Das PI beschreibt den Bereich künftiger Einzelwerte; die Unsicherheit steigt mit der Entfernung.", "tags": ["Analyze-Phase"], "flags": []}, {"id": 160, "nr": 160, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Fragen soll DoE laut Kursunterlage beantworten?", "src": "DoE S.4", "options": [{"key": "a", "text": "Welche Eingangsgrößen haben den größten Einfluss auf die Ausgangsgrößen?", "correct": true}, {"key": "b", "text": "Welche Kombination der Eingangsgrößen erfüllt die Zielwerte am besten?", "correct": true}, {"key": "c", "text": "Wie kann das System unempfindlich gegen Störgrößen gemacht werden (robustes Design)?", "correct": true}, {"key": "d", "text": "Welche Mitarbeitenden verursachen die Fehler?", "correct": false}], "explanation": "Zusätzlich: Wie empfindlich reagiert y auf Änderungen der x, und lässt sich die Leistung vorhersagen?", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 161, "nr": 161, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Definitionen im DoE sind richtig?", "src": "DoE S.6", "options": [{"key": "a", "text": "Kontrollierbare Eingangsgrößen (x) sind Faktoren, die gezielt verändert werden können", "correct": true}, {"key": "b", "text": "Die Ergebnisgröße (y) wird auch Antwort oder abhängige Variable genannt", "correct": true}, {"key": "c", "text": "Störgrößen (N) sind nicht oder nur mit zu hohem Aufwand kontrollierbar, z. B. Wetter, Schicht", "correct": true}, {"key": "d", "text": "Störgrößen sind die Faktoren, die im Versuch gezielt verstellt werden", "correct": false}], "explanation": "x = Faktoren, y = Response, N = Noise (Störgrößen).", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 162, "nr": 162, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Nachteile hat die One-Factor-at-a-Time-Methode (OFAT)?", "src": "DoE S.14, S.16", "options": [{"key": "a", "text": "Sie deckt den Versuchsraum nur unzureichend ab", "correct": true}, {"key": "b", "text": "Sie versagt bei starken Wechselwirkungen", "correct": true}, {"key": "c", "text": "Das tatsächliche Optimum wird oft nicht gefunden", "correct": true}, {"key": "d", "text": "Sie benötigt immer weniger Versuche als jedes DoE", "correct": false}], "explanation": "Bei OFAT wird immer nur ein Faktor variiert – Wechselwirkungen bleiben unerkannt.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 163, "nr": 163, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Vorteile von DoE nennt die Kursunterlage?", "src": "DoE S.17", "options": [{"key": "a", "text": "Einsparung an Zeit und Kapazität durch gleichzeitige Änderung mehrerer Parameter", "correct": true}, {"key": "b", "text": "Wechselwirkungen zwischen Einflussgrößen werden erkannt", "correct": true}, {"key": "c", "text": "Mathematisches Modell zur Vorhersage und Optimierung", "correct": true}, {"key": "d", "text": "Extrapolation weit über den getesteten Bereich hinaus", "correct": false}], "explanation": "DoE liefert eindeutige Interpretation und Modellierung – aber nur im getesteten Bereich.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 164, "nr": 164, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Was gilt für das empirische Modell aus einem DoE?", "src": "DoE S.18–S.19", "options": [{"key": "a", "text": "Es gilt nur im Bereich der getesteten Einstellungen (keine Extrapolation)", "correct": true}, {"key": "b", "text": "Es gilt nur unter Berücksichtigung der Zufallsstreuung", "correct": true}, {"key": "c", "text": "Das System wird meist als Black Box betrachtet", "correct": true}, {"key": "d", "text": "Es liefert immer die physikalischen Ursachen", "correct": false}], "explanation": "Nachteil des Black-Box-Ansatzes: Informationen über Wirkungen, jedoch keine Ursachen.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 165, "nr": 165, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Reihenfolge hat die DoE-Roadmap laut Kursunterlage?", "src": "DoE S.20", "options": [{"key": "a", "text": "Systemanalyse → Wahl des Versuchsdesigns → Planung/Bereitstellung von Ressourcen → Versuchsdurchführung → Datenanalyse → Ergebnisbestätigung", "correct": true}, {"key": "b", "text": "Wahl des Designs → Systemanalyse → Datenanalyse → Versuchsdurchführung → Ressourcen → Bestätigung", "correct": false}, {"key": "c", "text": "Versuchsdurchführung → Systemanalyse → Design → Datenanalyse → Ressourcen → Bestätigung", "correct": false}, {"key": "d", "text": "Systemanalyse → Datenanalyse → Design → Bestätigung → Durchführung → Ressourcen", "correct": false}], "explanation": "6 Schritte: 1 Systemanalyse, 2 Design, 3 Planung/Ressourcen, 4 Durchführung, 5 Datenanalyse, 6 Bestätigung.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 166, "nr": 166, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Fragen gehören zur Systemanalyse (Schritt 1)?", "src": "DoE S.21–S.22", "options": [{"key": "a", "text": "Geht es um Zentrierung oder Streuungsreduktion?", "correct": true}, {"key": "b", "text": "Habe ich ein fähiges Messsystem?", "correct": true}, {"key": "c", "text": "Auflisten aller relevanten Ziel- und Einflussgrößen (P-Diagramm)", "correct": true}, {"key": "d", "text": "Welche Lösung wurde bereits umgesetzt?", "correct": false}], "explanation": "Weitere Fragen: Welche Veränderung will ich entdecken? Ist y normalverteilt? Brauche ich mehrere Zielgrößen?", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 167, "nr": 167, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Was passiert, wenn die Faktorstufen falsch gewählt werden?", "src": "DoE S.24", "options": [{"key": "a", "text": "Zu eng gesetzt: Der Effekt kann durch Störgrößen zugedeckt werden", "correct": true}, {"key": "b", "text": "Zu weit gesetzt: Der Effekt kann durch Krümmung verkürzt werden", "correct": true}, {"key": "c", "text": "Ein Center Point hilft, Krümmung zu erkennen", "correct": true}, {"key": "d", "text": "Die Stufenwahl hat keinen Einfluss auf das Ergebnis", "correct": false}], "explanation": "Die Auswahl der Faktorstufen ist entscheidend für ein aussagekräftiges Experiment.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 168, "nr": 168, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Versuchspläne eignen sich laut Kursunterlage für welchen Zweck?", "src": "DoE S.26–S.28", "options": [{"key": "a", "text": "Screening: teilfaktorielle Versuche mit 2 Stufen je Faktor", "correct": true}, {"key": "b", "text": "Characterization: vollfaktorielle Versuche (2–6 wichtige Variablen, Wechselwirkungen)", "correct": true}, {"key": "c", "text": "Optimization: vollfaktorielle Versuche und Response-Surface-Designs", "correct": true}, {"key": "d", "text": "Screening: Response-Surface-Designs", "correct": false}], "explanation": "Vom Groben ins Detail: Screening → Charakterisierung → Optimierung.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 169, "nr": 169, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Wann sind Screening-Pläne besonders geeignet?", "src": "DoE S.27", "options": [{"key": "a", "text": "Wenn erst wenig über die Problemstellung bekannt ist", "correct": true}, {"key": "b", "text": "Wenn viele Faktoren untersucht werden sollen", "correct": true}, {"key": "c", "text": "Mit extremen Faktorstufen, um keinen Effekt zu übersehen", "correct": true}, {"key": "d", "text": "Wenn bereits alle Wechselwirkungen bekannt sind", "correct": false}], "explanation": "Risiko: Fehlzuweisungen durch überlagerte Wechselwirkungen.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 170, "nr": 170, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Was versteht man unter Randomisierung und Blockbildung?", "src": "DoE S.29–S.30", "options": [{"key": "a", "text": "Randomisierung: Einzelversuche in zufälliger Reihenfolge, damit Trends die Effekte nicht verfälschen", "correct": true}, {"key": "b", "text": "Blockbildung: Einteilung in Gruppen (z. B. je Materialcharge oder Woche), um bekannte Änderungen aus der Zufallsstreuung herauszuhalten", "correct": true}, {"key": "c", "text": "Zuerst Blöcke bilden, dann innerhalb der Blöcke randomisieren", "correct": true}, {"key": "d", "text": "Randomisierung bedeutet, Versuche bei Bedarf wegzulassen", "correct": false}], "explanation": "Gemeinsam bieten sie optimale Absicherung gegen veränderte Versuchsbedingungen.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 171, "nr": 171, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Ein 2³-Versuchsplan soll in zwei Schichten (je 4 Versuche) durchgeführt werden. Welche Spalte nutzt man laut Kursunterlage zur Blockbildung?", "src": "DoE S.31", "options": [{"key": "a", "text": "Die Wechselwirkung höchster Ordnung (ABC)", "correct": true}, {"key": "b", "text": "Den Faktor C", "correct": false}, {"key": "c", "text": "Den Faktor A", "correct": false}, {"key": "d", "text": "Die Wechselwirkung AB", "correct": false}], "explanation": "ABC ist vermutlich nicht signifikant; dafür wird sie mit dem Schichteffekt überlagert. Würde man C nehmen, wäre C nicht vom Schichteffekt trennbar.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 172, "nr": 172, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Wodurch ist die statistische Gültigkeit eines Experiments laut Kursunterlage bedroht?", "src": "DoE S.33", "options": [{"key": "a", "text": "Zu geringe Stichprobengröße", "correct": true}, {"key": "b", "text": "Nicht geeignetes Messsystem", "correct": true}, {"key": "c", "text": "Überlagerung von Effekten bei teilfaktoriellen Versuchen (interne Gültigkeit)", "correct": true}, {"key": "d", "text": "Durchführung eines Bestätigungslaufs", "correct": false}], "explanation": "Interne Gültigkeit: War es wirklich das x oder eine Störgröße? Externe: Übertragbarkeit auf ähnliche Systeme.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 173, "nr": 173, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Wie viele Testläufe benötigt ein vollfaktorieller Versuchsplan mit 4 Faktoren auf 3 Stufen?", "src": "DoE S.36 (Berechnung)", "options": [{"key": "a", "text": "81", "correct": true}, {"key": "b", "text": "64", "correct": false}, {"key": "c", "text": "12", "correct": false}, {"key": "d", "text": "27", "correct": false}], "explanation": "n^k = 3⁴ = 81. (2⁴ = 16, 4³ = 64, 3³ = 27)", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 174, "nr": 174, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Warum lässt sich trotz gleichzeitiger Änderung mehrerer Faktoren der Einfluss jedes Faktors berechnen?", "src": "DoE S.37", "options": [{"key": "a", "text": "Jeder Faktor hat gleich viele +- und −-Zustände", "correct": true}, {"key": "b", "text": "Jeder Zustand eines Faktors sieht die identischen Kombinationen der anderen Faktoren", "correct": true}, {"key": "c", "text": "Jeder Faktor hat eine individuell kodierte Spalte", "correct": true}, {"key": "d", "text": "Weil immer nur ein Faktor verändert wird", "correct": false}], "explanation": "Diese Orthogonalität (Ausgewogenheit) erlaubt die getrennte Schätzung der Effekte.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 175, "nr": 175, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Was ist eine Wechselwirkung im DoE?", "src": "DoE S.38, S.74", "options": [{"key": "a", "text": "Wenn die Wirkung von Faktor A davon abhängt, wie Faktor B eingestellt ist", "correct": true}, {"key": "b", "text": "Sie zeigt sich durch nicht parallele Linien im Wechselwirkungsdiagramm", "correct": true}, {"key": "c", "text": "Wenn zwei Faktoren immer gleich eingestellt werden", "correct": false}, {"key": "d", "text": "Die Summe der Haupteffekte", "correct": false}], "explanation": "Parallele Teileffektgeraden = keine Wechselwirkung.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 176, "nr": 176, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "2²-Versuch (Aspirin A, Bier B): A−/B− → y = 1; A−/B+ → y = 3; A+/B− → y = 4; A+/B+ → y = 10. Welche Effekte stimmen?", "src": "DoE S.41–S.43 (Berechnung)", "options": [{"key": "a", "text": "Effekt A = 5", "correct": true}, {"key": "b", "text": "Effekt B = 4", "correct": true}, {"key": "c", "text": "Wechselwirkung AB = 2", "correct": true}, {"key": "d", "text": "Effekt A = 7", "correct": false}], "explanation": "A: (4+10)/2 − (1+3)/2 = 7 − 2 = 5; B: (3+10)/2 − (1+4)/2 = 6,5 − 2,5 = 4; AB: (1+10)/2 − (3+4)/2 = 5,5 − 3,5 = 2.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 177, "nr": 177, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Aussagen zur Transferfunktion y = b0 + b1x1 + b2x2 + b12x1x2 + b11x1² + … + ε sind richtig?", "src": "DoE S.44", "options": [{"key": "a", "text": "b12x1x2 ist der Wechselwirkungsanteil", "correct": true}, {"key": "b", "text": "b11x1² ist ein nichtlinearer Anteil", "correct": true}, {"key": "c", "text": "Die Koeffizienten werden nach dem Versuch mittels Regression angepasst", "correct": true}, {"key": "d", "text": "Je umfangreicher das Modell, desto weniger Versuche sind nötig", "correct": false}], "explanation": "ε ist der Fehleranteil; komplexere Modelle brauchen mehr Versuche.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 178, "nr": 178, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Vor- und Nachteile haben vollfaktorielle Versuchspläne?", "src": "DoE S.45", "options": [{"key": "a", "text": "Vorteil: Informationen über alle Haupteffekte und Wechselwirkungen", "correct": true}, {"key": "b", "text": "Nachteil: zeit- und ressourcenintensiv", "correct": true}, {"key": "c", "text": "Vorteil: wenige Versuche bei vielen Faktoren", "correct": false}, {"key": "d", "text": "Nachteil: Wechselwirkungen sind nicht bestimmbar", "correct": false}], "explanation": "Mindestanzahl der Versuche X^k; jede weitere Stufe erhöht den Aufwand beträchtlich.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 179, "nr": 179, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "6 Faktoren auf 2 Stufen: Welche Zuordnung teilfaktorieller Pläne stimmt laut Kursunterlage?", "src": "DoE S.47", "options": [{"key": "a", "text": "Vollfaktoriell: 64 Versuche", "correct": true}, {"key": "b", "text": "1/2-Plan 2^(6−1): 32 Versuche, Auflösung VI", "correct": true}, {"key": "c", "text": "1/4-Plan 2^(6−2): 16 Versuche, Auflösung IV", "correct": true}, {"key": "d", "text": "1/8-Plan 2^(6−3): 8 Versuche, Auflösung V", "correct": false}], "explanation": "1/8-Plan hat 8 Versuche mit Auflösung III.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 180, "nr": 180, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Auf welchen Prinzipien beruhen teilfaktorielle Versuchspläne?", "src": "DoE S.48", "options": [{"key": "a", "text": "„Spärlichkeit der Effekte“ – wenige Haupteffekte und niedrige Wechselwirkungen dominieren", "correct": true}, {"key": "b", "text": "Projektionseigenschaft – sie werden vollfaktoriell, wenn einige Faktoren nicht signifikant sind", "correct": true}, {"key": "c", "text": "Sequentielles Experimentieren – Half Fractions können zu vollfaktoriellen Plänen „umgefaltet“ werden", "correct": true}, {"key": "d", "text": "Alle Wechselwirkungen höherer Ordnung sind immer signifikant", "correct": false}], "explanation": "Diese drei Prinzipien rechtfertigen den reduzierten Versuchsumfang.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 181, "nr": 181, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Wie viele Testläufe hat ein teilfaktorieller Plan 2^(5−1)?", "src": "DoE S.50 (Berechnung)", "options": [{"key": "a", "text": "16", "correct": true}, {"key": "b", "text": "32", "correct": false}, {"key": "c", "text": "10", "correct": false}, {"key": "d", "text": "8", "correct": false}], "explanation": "2^(k−p) = 2^(5−1) = 2⁴ = 16 (Halbplan von 32).", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 182, "nr": 182, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Bewertung der Auflösung teilfaktorieller Pläne ist laut Kursunterlage richtig?", "src": "DoE S.52", "options": [{"key": "a", "text": "Auflösung III: Faktor mit 2-fach-WW vermengt – kritisch", "correct": true}, {"key": "b", "text": "Auflösung IV: Faktor mit 3FWW bzw. 2FWW mit 2FWW – weniger kritisch", "correct": true}, {"key": "c", "text": "Auflösung V: unkritisch", "correct": true}, {"key": "d", "text": "Auflösung III: unkritisch", "correct": false}], "explanation": "Die kleinste Buchstabenzahl im Generator bestimmt die Auflösung (2^(3−1): I = ABC → III; 2^(4−1): I = ABCD → IV).", "tags": ["Design of Experiments (DoE)"], "flag
