s": []}, {"id": 183, "nr": 183, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Welche Erfolgsfaktoren für DoE nennt die Kursunterlage?", "src": "DoE S.54", "options": [{"key": "a", "text": "Klare Festlegung von Ziel und Zweck zu Beginn", "correct": true}, {"key": "b", "text": "Versuche in zufälliger Reihenfolge durchführen", "correct": true}, {"key": "c", "text": "Faustregel: ca. 25 % des Budgets in die erste DoE-Versuchsreihe", "correct": true}, {"key": "d", "text": "Auf einen Bestätigungsversuch verzichten, um Budget zu sparen", "correct": false}], "explanation": "Außerdem: y genau messen, ausreichend Wiederholungen, Klarheit über Vermengungen, Bestätigungsversuch.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 184, "nr": 184, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Bei der schrittweisen Auswertung eines DoE in Minitab werden Faktoren aus dem Modell entfernt. Ab welchem p-Wert laut Kursunterlage?", "src": "DoE S.56, S.68", "options": [{"key": "a", "text": "p > 0,1", "correct": true}, {"key": "b", "text": "p > 0,01", "correct": false}, {"key": "c", "text": "p > 0,5", "correct": false}, {"key": "d", "text": "p < 0,05", "correct": false}], "explanation": "Im DoE-Beispiel wird mit 10 % Irrtumswahrscheinlichkeit gearbeitet: p < 0,1 → signifikanter Einfluss.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 185, "nr": 185, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Was zeigt der Normalverteilungsplot der Effekte?", "src": "DoE S.66", "options": [{"key": "a", "text": "Effekte, die von der gedachten Geraden abweichen, sind wahrscheinlich nicht zufällig und möglicherweise signifikant", "correct": true}, {"key": "b", "text": "Effekte auf der Geraden sind besonders signifikant", "correct": false}, {"key": "c", "text": "Er zeigt die Rohdaten im Zeitverlauf", "correct": false}, {"key": "d", "text": "Er ersetzt die Bestätigungsversuche", "correct": false}], "explanation": "Ohne echte Effekte erwartet man eine Normalverteilung der Effekte um 0.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 186, "nr": 186, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Warum sind im Lautsprecher-Beispiel die Haupteffektdiagramme nicht aussagekräftig?", "src": "DoE S.73", "options": [{"key": "a", "text": "Weil intensive Wechselwirkungen vorliegen", "correct": true}, {"key": "b", "text": "Weil keine Wiederholungen durchgeführt wurden", "correct": false}, {"key": "c", "text": "Weil die Daten nicht normalverteilt waren", "correct": false}, {"key": "d", "text": "Weil nur ein Faktor untersucht wurde", "correct": false}], "explanation": "Bei starken Wechselwirkungen müssen Wechselwirkungsdiagramme bzw. der Cube Plot herangezogen werden.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 187, "nr": 187, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Was sollte bei der Residuenanalyse im DoE erkennbar sein?", "src": "DoE S.70", "options": [{"key": "a", "text": "Der Normalverteilungsplot der Residuen zeigt eine Gerade", "correct": true}, {"key": "b", "text": "Die Streuung ist für alle Fits gleich", "correct": true}, {"key": "c", "text": "Keine Muster, nur Zufallsstreuung; Mittelwert null", "correct": true}, {"key": "d", "text": "Ein deutlicher Trend im Zeitverlauf", "correct": false}], "explanation": "Residuum = beobachteter Wert − geschätzter Wert; Muster deuten auf Effekte außerhalb des Versuchsplans.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 188, "nr": 188, "module": "Kapitel 8: Design of Experiments (DoE)", "question": "Was ermöglicht der Response Optimizer in Minitab?", "src": "DoE S.79", "options": [{"key": "a", "text": "Optimale Einstellungen unter bestimmten Rahmenbedingungen finden (z. B. kürzere Klebezeit)", "correct": true}, {"key": "b", "text": "Wechselwirkungen höherer Ordnung berücksichtigen", "correct": true}, {"key": "c", "text": "Die Versuchsreihenfolge randomisieren", "correct": false}, {"key": "d", "text": "Die Messsystemanalyse durchführen", "correct": false}], "explanation": "Der Optimizer liefert ein prognostiziertes y für die gewählten Einstellungen.", "tags": ["Design of Experiments (DoE)"], "flags": []}, {"id": 189, "nr": 189, "module": "Kapitel 9: Improve-Phase", "question": "Was geschieht laut Kursunterlage in der Improve-Phase?", "src": "Improve S.2", "options": [{"key": "a", "text": "Es werden Lösungen für relevante Einflussgrößen ermittelt und umgesetzt", "correct": true}, {"key": "b", "text": "Die effiziente Abwicklung der Umsetzung wird geplant und durchgeführt", "correct": true}, {"key": "c", "text": "Die relevanten Einflussgrößen werden erstmals statistisch gesucht", "correct": false}, {"key": "d", "text": "Der Projektauftrag wird erstellt", "correct": false}], "explanation": "Improve: Lösungen für die relevanten x finden, bewerten, entscheiden und umsetzen.", "tags": ["Improve-Phase"], "flags": []}, {"id": 190, "nr": 190, "module": "Kapitel 9: Improve-Phase", "question": "Welche Methoden gehören laut Kursunterlage zur kreativen bzw. zur bewertenden Phase?", "src": "Improve S.4", "options": [{"key": "a", "text": "Kreative Phase: Brainstorming, Mind Mapping, Zufallswort", "correct": true}, {"key": "b", "text": "Bewertende Phase: Punktbewertung, Rangreihenmethode, Priorisierungsmatrix", "correct": true}, {"key": "c", "text": "Kreative Phase: Portfolioanalyse und Schiedsrichterverfahren", "correct": false}, {"key": "d", "text": "Bewertende Phase: Brainstorming und Skizzen", "correct": false}], "explanation": "Rechte Gehirnhälfte = Kreativität, linke = Entscheidungsfindung.", "tags": ["Improve-Phase"], "flags": []}, {"id": 191, "nr": 191, "module": "Kapitel 9: Improve-Phase", "question": "Welche Aussagen zur Kreativität sind laut Kursunterlage richtig?", "src": "Improve S.5", "options": [{"key": "a", "text": "Jeder Mensch besitzt kreative Fähigkeiten", "correct": true}, {"key": "b", "text": "Kreativität kann durch Übung und ein entsprechendes Klima gefördert werden", "correct": true}, {"key": "c", "text": "Kreative Tätigkeit muss absichtlich und zielgerichtet sein", "correct": true}, {"key": "d", "text": "Kreativität ist angeboren und nicht trainierbar", "correct": false}], "explanation": "Kreativität = Bildung neuer Kombinationen aus bekannten Informationen.", "tags": ["Improve-Phase"], "flags": []}, {"id": 192, "nr": 192, "module": "Kapitel 9: Improve-Phase", "question": "Welche Reihenfolge haben die Phasen des kreativen Denkprozesses?", "src": "Improve S.6", "options": [{"key": "a", "text": "Vorbereitung → Inkubation → Erleuchtung → Verifikation", "correct": true}, {"key": "b", "text": "Inkubation → Vorbereitung → Verifikation → Erleuchtung", "correct": false}, {"key": "c", "text": "Erleuchtung → Vorbereitung → Inkubation → Verifikation", "correct": false}, {"key": "d", "text": "Vorbereitung → Erleuchtung → Inkubation → Verifikation", "correct": false}], "explanation": "In der Inkubation arbeitet das Unterbewusstsein weiter; danach kommt die plötzliche Idee, die verifiziert wird.", "tags": ["Improve-Phase"], "flags": []}, {"id": 193, "nr": 193, "module": "Kapitel 9: Improve-Phase", "question": "Welche Grundregeln gelten beim Brainstorming?", "src": "Improve S.7", "options": [{"key": "a", "text": "Keine Kritik", "correct": true}, {"key": "b", "text": "Möglichst viele Ideen", "correct": true}, {"key": "c", "text": "Andere Ideen aufgreifen", "correct": true}, {"key": "d", "text": "Jede Idee sofort bewerten", "correct": false}], "explanation": "Dazu: freier Lauf der Fantasie; Dauer ca. 15–40 Minuten, nie nach dem ersten Höhepunkt aufgeben.", "tags": ["Improve-Phase"], "flags": []}, {"id": 194, "nr": 194, "module": "Kapitel 9: Improve-Phase", "question": "Wann endet eine Brainstorming-Sitzung laut Kursunterlage?", "src": "Improve S.8–S.9", "options": [{"key": "a", "text": "Wenn trotz Reizfragen keine Ideen mehr kommen", "correct": true}, {"key": "b", "text": "Nach dem ersten Höhepunkt der Ideenzahl", "correct": false}, {"key": "c", "text": "Nach genau 5 Minuten", "correct": false}, {"key": "d", "text": "Sobald die erste gute Idee gefunden ist", "correct": false}], "explanation": "Der Moderator stimuliert mit Reizfragen („Was würde die Konkurrenz machen?“).", "tags": ["Improve-Phase"], "flags": []}, {"id": 195, "nr": 195, "module": "Kapitel 9: Improve-Phase", "question": "Wofür steht die Methode 635?", "src": "Improve S.11", "options": [{"key": "a", "text": "6 Personen, je 3 Ideen, innerhalb von 5 Minuten", "correct": true}, {"key": "b", "text": "6 Ideen, 3 Personen, 5 Runden", "correct": false}, {"key": "c", "text": "6 Minuten, 3 Personen, 5 Ideen", "correct": false}, {"key": "d", "text": "6 Kriterien, 3 Alternativen, 5 Punkte", "correct": false}], "explanation": "Das Formular wird weitergegeben, und jeder knüpft an die Ideen des Vorgängers an.", "tags": ["Improve-Phase"], "flags": []}, {"id": 196, "nr": 196, "module": "Kapitel 9: Improve-Phase", "question": "Wann eignet sich die Methode 635 besonders?", "src": "Improve S.11", "options": [{"key": "a", "text": "Wenn Spannungen und Konflikte zu befürchten sind", "correct": true}, {"key": "b", "text": "Wenn eine Person zu dominierend sein könnte", "correct": true}, {"key": "c", "text": "Bei komplexen Problemen", "correct": true}, {"key": "d", "text": "Wenn nur eine Person verfügbar ist", "correct": false}], "explanation": "Als schriftliche Methode (Brainwriting) reduziert 635 Gruppeneffekte.", "tags": ["Improve-Phase"], "flags": []}, {"id": 197, "nr": 197, "module": "Kapitel 9: Improve-Phase", "question": "Was ist die Methode der „paradoxen Intervention“?", "src": "Improve S.13", "options": [{"key": "a", "text": "Man erarbeitet Möglichkeiten, das Ziel absichtlich NICHT zu erreichen", "correct": true}, {"key": "b", "text": "So werden Gefahren erkannt, die gezielt minimiert werden können", "correct": true}, {"key": "c", "text": "Man setzt die erste Idee ohne Prüfung um", "correct": false}, {"key": "d", "text": "Man bewertet Ideen mit Punkten", "correct": false}], "explanation": "Beispiel: „Welche Möglichkeiten haben wir, um Schrott zu erzeugen?“", "tags": ["Improve-Phase"], "flags": []}, {"id": 198, "nr": 198, "module": "Kapitel 9: Improve-Phase", "question": "Wofür stehen die Buchstaben von SCAMPER laut Kursunterlage?", "src": "Improve S.15", "options": [{"key": "a", "text": "S = Substitute (Ersetze)", "correct": true}, {"key": "b", "text": "C = Combine (Kombiniere)", "correct": true}, {"key": "c", "text": "E = Eliminate (Entferne)", "correct": true}, {"key": "d", "text": "R = Reduce (Reduziere Kosten)", "correct": false}], "explanation": "SCAMPER: Substitute, Combine, Adapt, Modify/Magnify, Put to another use, Eliminate, Rearrange/Reverse.", "tags": ["Improve-Phase"], "flags": []}, {"id": 199, "nr": 199, "module": "Kapitel 9: Improve-Phase", "question": "Welche Aussagen zu TRIZ sind richtig?", "src": "Improve S.16–S.17, S.21", "options": [{"key": "a", "text": "TRIZ steht für „Theorie des erfinderischen Problemlösens“ und wurde von Genrikh Altshuller entwickelt", "correct": true}, {"key": "b", "text": "Der Widerspruch ist das zentrale Element; die Widerspruchsmatrix nutzt 39 technische Parameter", "correct": true}, {"key": "c", "text": "Die Matrix schlägt Lösungen aus 40 innovativen Prinzipien vor", "correct": true}, {"key": "d", "text": "TRIZ wurde von Alex Osborn entwickelt", "correct": false}], "explanation": "Grundannahme: Viele Probleme wurden in anderen Branchen bereits ähnlich gelöst.", "tags": ["Improve-Phase"], "flags": []}, {"id": 200, "nr": 200, "module": "Kapitel 9: Improve-Phase", "question": "Welche Vor- und Nachteile haben intuitive bzw. analytische Bewertungsmethoden?", "src": "Improve S.27", "options": [{"key": "a", "text": "Intuitive (z. B. Punktbewertung): schnell, aber unklar, welche Kriterien herangezogen wurden", "correct": true}, {"key": "b", "text": "Analytische (z. B. Pugh-Matrix): objektiv, nachvollziehbar, Bezug zu CTQs, aber zeitintensiver", "correct": true}, {"key": "c", "text": "Analytische Methoden sind schneller als intuitive", "correct": false}, {"key": "d", "text": "Intuitive Methoden sind immer objektiv", "correct": false}], "explanation": "Bei intuitiven Methoden besteht die Gefahr machtpolitischer Einflüsse.", "tags": ["Improve-Phase"], "flags": []}, {"id": 201, "nr": 201, "module": "Kapitel 9: Improve-Phase", "question": "Wie funktioniert die Punktbewertungsmethode?", "src": "Improve S.30", "options": [{"key": "a", "text": "Jeder Teilnehmer erhält eine Anzahl Punkte (meist 3) und vergibt sie an die wichtigsten Alternativen", "correct": true}, {"key": "b", "text": "Meist sind maximal 2 Punkte pro Alternative erlaubt", "correct": true}, {"key": "c", "text": "Die Alternative mit den meisten Punkten ist die wichtigste", "correct": true}, {"key": "d", "text": "Jeder Teilnehmer darf alle Punkte an eine einzige Alternative vergeben (mind. 5)", "correct": false}], "explanation": "Ergebnis ist eine Reihung der Alternativen.", "tags": ["Improve-Phase"], "flags": []}, {"id": 202, "nr": 202, "module": "Kapitel 9: Improve-Phase", "question": "Wie funktioniert die Pugh-Matrix?", "src": "Improve S.32", "options": [{"key": "a", "text": "Eine Lösung wird als Vergleichsbasis gewählt", "correct": true}, {"key": "b", "text": "Die anderen Alternativen werden je Kriterium mit besser (+), schlechter (−) oder gleich (0) bewertet", "correct": true}, {"key": "c", "text": "Bewertungen werden mit der Gewichtung multipliziert; die Summen bilden eine Rangfolge", "correct": true}, {"key": "d", "text": "Alle Lösungen werden absolut auf einer Skala von 1–100 bewertet", "correct": false}], "explanation": "Die Matrix erlaubt auch die Kombination von Konzepten, um Schwächen zu vermeiden.", "tags": ["Improve-Phase"], "flags": []}, {"id": 203, "nr": 203, "module": "Kapitel 9: Improve-Phase", "question": "Nutzwertanalyse: Kriterium K1 (Gewicht 5), K2 (Gewicht 3). Alternative A erhält 6 bzw. 8 Punkte, Alternative B 8 bzw. 4 Punkte. Welche Aussagen stimmen?", "src": "Improve S.34–S.35 (Berechnung)", "options": [{"key": "a", "text": "A erreicht 54 Punkte", "correct": true}, {"key": "b", "text": "B erreicht 52 Punkte", "correct": true}, {"key": "c", "text": "A ist zu bevorzugen", "correct": true}, {"key": "d", "text": "B ist zu bevorzugen", "correct": false}], "explanation": "A: 5·6 + 3·8 = 30 + 24 = 54; B: 5·8 + 3·4 = 40 + 12 = 52.", "tags": ["Improve-Phase"], "flags": []}, {"id": 204, "nr": 204, "module": "Kapitel 9: Improve-Phase", "question": "Welche Prinzipien gelten für die Entscheidungsmatrix laut Kursunterlage?", "src": "Improve S.38", "options": [{"key": "a", "text": "Kriterien werden idealerweise vor der Konzeptfindung definiert", "correct": true}, {"key": "b", "text": "Kriterien müssen eindeutig und von allen gleich verstanden sein", "correct": true}, {"key": "c", "text": "Lösungskonzepte sollten als Skizzen in der Matrix dargestellt werden", "correct": true}, {"key": "d", "text": "Konzepte dürfen unterschiedliche Anforderungen erfüllen", "correct": false}], "explanation": "Alle Konzepte sind Lösungen mit denselben Anforderungen und Rahmenbedingungen, annähernd gleich detailliert.", "tags": ["Improve-Phase"], "flags": []}, {"id": 205, "nr": 205, "module": "Kapitel 9: Improve-Phase", "question": "Welche Lösungen sollen laut Aufwand-Nutzen-Matrix weiterverfolgt werden?", "src": "Improve S.39", "options": [{"key": "a", "text": "Lösungen mit hohem Nutzen und geringem Aufwand", "correct": true}, {"key": "b", "text": "Lösungen mit niedrigem Nutzen und hohem Aufwand", "correct": false}, {"key": "c", "text": "Lösungen mit niedrigem Nutzen und geringem Aufwand", "correct": false}, {"key": "d", "text": "Alle Lösungen gleichermaßen", "correct": false}], "explanation": "Niedriger Nutzen bei hohem Aufwand: Implementierung nicht sinnvoll; niedriger Nutzen/geringer Aufwand: Themen mit geringem Potenzial.", "tags": ["Improve-Phase"], "flags": []}, {"id": 206, "nr": 206, "module": "Kapitel 9: Improve-Phase", "question": "Was ist der Nutzen einer Bewertungsmatrix laut Kursunterlage?", "src": "Improve S.40", "options": [{"key": "a", "text": "Dokumentation der Entscheidung", "correct": true}, {"key": "b", "text": "Höhere Identifikation mit der gewählten Lösung", "correct": true}, {"key": "c", "text": "Höhere Wahrscheinlichkeit, dass die beste Lösung gewählt wird", "correct": true}, {"key": "d", "text": "Sie ersetzt den Pilotversuch", "correct": false}], "explanation": "Außerdem Basis für Diskussionen, Visualisierungs- und Kommunikationshilfe.", "tags": ["Improve-Phase"], "flags": []}, {"id": 207, "nr": 207, "module": "Kapitel 9: Improve-Phase", "question": "Was gehört laut Kursunterlage zu den Schritten der Implementierung von Lösungen?", "src": "Improve S.42", "options": [{"key": "a", "text": "Überprüfung der Verbesserungswirkung in einer Pilotanwendung inkl. neuer Prozessfähigkeit", "correct": true}, {"key": "b", "text": "Überarbeitung der Kosten-Nutzen-Analyse", "correct": true}, {"key": "c", "text": "Ermittlung der Implementierungsrisiken", "correct": true}, {"key": "d", "text": "Verzicht auf Dokumentation der neuen Prozesse", "correct": false}], "explanation": "10 Schritte: Dokumentation, Pilot, Revision, Kosten/Nutzen, Planung, Risiken, Freigabe, Umsetzung, Standardisierung, Überwachung.", "tags": ["Improve-Phase"], "flags": []}, {"id": 208, "nr": 208, "module": "Kapitel 9: Improve-Phase", "question": "Was ist bei der Definition eines Piloten zu beachten?", "src": "Improve S.43", "options": [{"key": "a", "text": "Bereich, Dauer und Umfang gemeinsam mit dem Prozesseigner festlegen", "correct": true}, {"key": "b", "text": "Erfolgsnachweis, zu erhebende Daten und Stichprobenumfang festlegen", "correct": true}, {"key": "c", "text": "Ggf. eine Prozess-FMEA für den verbesserten Prozess durchführen", "correct": true}, {"key": "d", "text": "Der Pilot gilt nur für Produktionsprozesse, nicht für administrative", "correct": false}], "explanation": "Die Pilotregeln gelten ausdrücklich auch für administrative Prozesse.", "tags": ["Improve-Phase"], "flags": []}, {"id": 209, "nr": 209, "module": "Kapitel 9: Improve-Phase", "question": "Welche Planungswerkzeuge nennt die Kursunterlage für die Implementierungsplanung?", "src": "Improve S.46–S.48", "options": [{"key": "a", "text": "Maßnahmenplan (Aktionsplan)", "correct": true}, {"key": "b", "text": "Gantt-Diagramm (Balkendiagramm)", "correct": true}, {"key": "c", "text": "Flussdiagramm", "correct": true}, {"key": "d", "text": "Boxplot", "correct": false}], "explanation": "Das Gantt-Diagramm stellt Aufgaben im Zeitablauf und deren Abhängigkeiten dar (nach Henry L. Gantt).", "tags": ["Improve-Phase"], "flags": []}, {"id": 210, "nr": 210, "module": "Kapitel 9: Improve-Phase", "question": "Was ist vor dem Pilotstart laut Kursunterlage sicherzustellen?", "src": "Improve S.49", "options": [{"key": "a", "text": "Das beteiligte Team ist in der Umsetzung trainiert", "correct": true}, {"key": "b", "text": "Alle Verantwortlichkeiten und Aufgaben sind bekannt", "correct": true}, {"key": "c", "text": "Vor- und nachgelagerte Prozesse, Kunden und Lieferanten sind informiert", "correct": true}, {"key": "d", "text": "Die Kunden erfahren erst nach dem Piloten davon", "correct": false}], "explanation": "Teammitglieder müssen absolute Sicherheit in der Anwendung der neuen Regelungen haben.", "tags": ["Improve-Phase"], "flags": []}, {"id": 211, "nr": 211, "module": "Kapitel 10: Methoden des Lean Management", "question": "Welche Ziele und Instrumente unterscheiden Lean Management und Six Sigma laut Kursunterlage?", "src": "Lean Management S.3", "options": [{"key": "a", "text": "Lean: Komplexität und Verschwendung als Wertverlust sichtbar machen, messen und abbauen", "correct": true}, {"key": "b", "text": "Six Sigma: Abweichungen von CTQs messen, verstehen, abbauen und kontrollieren", "correct": true}, {"key": "c", "text": "Gemeinsames Ziel: Prozesse nachhaltig verbessern", "correct": true}, {"key": "d", "text": "Lean nutzt als Hauptinstrument den DMAIC-Zyklus, Six Sigma die Prozessanalyse", "correct": false}], "explanation": "Lean-Instrument = Prozessanalysen; Six-Sigma-Instrument = DMAIC.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 212, "nr": 212, "module": "Kapitel 10: Methoden des Lean Management", "question": "Welche Methoden zählt die Kursunterlage zu den wichtigen Methoden im Lean Manufacturing?", "src": "Lean Management S.9", "options": [{"key": "a", "text": "5S (5A)", "correct": true}, {"key": "b", "text": "Rüstzeitverkürzung (SMED)", "correct": true}, {"key": "c", "text": "TPM und OEE-Wertberechnungen", "correct": true}, {"key": "d", "text": "Hypothesentests", "correct": false}], "explanation": "Weitere: Kanban/Pull, POUS, Standardized Work, Teamwork, visuelles Management, Wertstromanalyse.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 213, "nr": 213, "module": "Kapitel 10: Methoden des Lean Management", "question": "Wie lauten die 5A in der richtigen Reihenfolge?", "src": "Lean Management S.12", "options": [{"key": "a", "text": "Aussortieren → Aufräumen → Arbeitsplatz sauber halten → Anordnungen zur Regel machen → Alle Punkte einhalten und ständig verbessern", "correct": true}, {"key": "b", "text": "Aufräumen → Aussortieren → Anordnungen zur Regel machen → Arbeitsplatz sauber halten → Alle Punkte einhalten", "correct": false}, {"key": "c", "text": "Arbeitsplatz sauber halten → Aussortieren → Aufräumen → Alle Punkte einhalten → Anordnungen zur Regel machen", "correct": false}, {"key": "d", "text": "Aussortieren → Anordnungen zur Regel machen → Aufräumen → Arbeitsplatz sauber halten → Alle Punkte einhalten", "correct": false}], "explanation": "Englisch: Sort, Set in Order, Shine, Standardize, Sustain.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 214, "nr": 214, "module": "Kapitel 10: Methoden des Lean Management", "question": "Welche Vorteile von Ordnung und Sauberkeit (5S) nennt die Kursunterlage?", "src": "Lean Management S.13", "options": [{"key": "a", "text": "Weniger Suchzeit, weil alles seinen Platz hat", "correct": true}, {"key": "b", "text": "Frühzeitige Fehlererkennung durch vereinfachte visuelle Kontrolle", "correct": true}, {"key": "c", "text": "Reduzierung von Unfällen durch Beseitigung von Stolperfallen", "correct": true}, {"key": "d", "text": "Höhere Lagerbestände", "correct": false}], "explanation": "Zeitersparnis = Kostenersparnis.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 215, "nr": 215, "module": "Kapitel 10: Methoden des Lean Management", "question": "Wie läuft die „Aktion Roter Punkt“ ab?", "src": "Lean Management S.15–S.16", "options": [{"key": "a", "text": "Nicht mehr benötigte Gegenstände erhalten einen roten Punkt bzw. eine rote Karte", "correct": true}, {"key": "b", "text": "Kann der Verbleib nicht begründet werden, wird der Gegenstand entfernt", "correct": true}, {"key": "c", "text": "Die Mitarbeitenden führen die Aktion in ihrem eigenen Arbeitsbereich durch", "correct": true}, {"key": "d", "text": "Vorbildliche Gegenstände erhalten ebenfalls einen roten Punkt", "correct": false}], "explanation": "Grüne Karten markieren vorbildliche Gegenstände; rote auch Behinderungen, Unfallgefahren und Verbesserungspotenzial.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 216, "nr": 216, "module": "Kapitel 10: Methoden des Lean Management", "question": "Was gilt laut Kursunterlage für den Schritt „Sauberkeit“ bei 5S?", "src": "Lean Management S.26–S.27", "options": [{"key": "a", "text": "Reinigen ist gleichzeitig Inspektion", "correct": true}, {"key": "b", "text": "Verschmutzung kann ein Hinweis auf eine Fehlerquelle sein", "correct": true}, {"key": "c", "text": "Ein Anstrich mit heller Farbe hilft, Verschmutzung früh zu erkennen", "correct": true}, {"key": "d", "text": "Die Reinigung erfolgt ausschließlich durch eine externe Reinigungsfirma", "correct": false}], "explanation": "Der Arbeitsplatz wird von den Mitarbeitenden selbst gereinigt – nur eine saubere Anlage produziert Qualität.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 217, "nr": 217, "module": "Kapitel 10: Methoden des Lean Management", "question": "Wie wird der 5. Schritt (Selbstdisziplin) laut Kursunterlage sichergestellt?", "src": "Lean Management S.33", "options": [{"key": "a", "text": "Regelmäßige 5A-Audits mit Auditcheckliste", "correct": true}, {"key": "b", "text": "Ableitung von Verbesserungsmaßnahmen", "correct": true}, {"key": "c", "text": "Standards dürfen in Frage gestellt und verbessert werden", "correct": true}, {"key": "d", "text": "Standards sind unveränderlich", "correct": false}], "explanation": "Festgelegt werden Frequenzen, Verantwortliche, Eigen- oder Fremdaudits.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 218, "nr": 218, "module": "Kapitel 10: Methoden des Lean Management", "question": "Wofür steht SMED?", "src": "Lean Management S.36", "options": [{"key": "a", "text": "Single Minute Exchange of Die – Werkzeugwechsel im einstelligen Minutenbereich", "correct": true}, {"key": "b", "text": "Standard Method of Error Detection", "correct": false}, {"key": "c", "text": "Six Minute Exchange Design", "correct": false}, {"key": "d", "text": "Single Machine Efficiency Data", "correct": false}], "explanation": "Ziel: Rüstzeiten und damit verbundene Verschwendung reduzieren, Durchlaufzeit optimieren.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 219, "nr": 219, "module": "Kapitel 10: Methoden des Lean Management", "question": "Wie ist die Rüstzeit laut Kursunterlage definiert?", "src": "Lean Management S.38", "options": [{"key": "a", "text": "Vom letzten einwandfreien Produkt der Serie A bis zum ersten einwandfreien Produkt der Serie B mit Normgeschwindigkeit", "correct": true}, {"key": "b", "text": "Vom Abschalten bis zum Einschalten der Maschine", "correct": false}, {"key": "c", "text": "Nur die Zeit für den reinen Werkzeugwechsel", "correct": false}, {"key": "d", "text": "Vom Auftragseingang bis zur Auslieferung", "correct": false}], "explanation": "Der Testlauf (Anlauf bis zur Normgeschwindigkeit) zählt zur Rüstzeit.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 220, "nr": 220, "module": "Kapitel 10: Methoden des Lean Management", "question": "Welche Ergebnisse sind laut Kursunterlage durch SMED möglich?", "src": "Lean Management S.37", "options": [{"key": "a", "text": "Umstellzeiten können bereits beim ersten Durchlauf um bis zu 60 % reduziert werden", "correct": true}, {"key": "b", "text": "Bei mehrmaligen Durchläufen sind 50–90 % Reduktion möglich", "correct": true}, {"key": "c", "text": "Weitere Durchläufe können immer kostspieliger werden", "correct": true}, {"key": "d", "text": "Rüstzeiten lassen sich immer auf null reduzieren", "correct": false}], "explanation": "Grenze: Ertrag einer kürzeren Rüstzeit vs. Kosten der Maßnahme.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 221, "nr": 221, "module": "Kapitel 10: Methoden des Lean Management", "question": "Welche Phasen umfasst das 3-Phasen-Modell der SMED-Methode?", "src": "Lean Management S.46–S.48", "options": [{"key": "a", "text": "Phase 1: Interne und externe Vorgänge trennen", "correct": true}, {"key": "b", "text": "Phase 2: Interne Vorgänge in externe umwandeln", "correct": true}, {"key": "c", "text": "Phase 3: Interne und externe Vorgänge verkürzen", "correct": true}, {"key": "d", "text": "Phase 1: Alle Vorgänge intern durchführen", "correct": false}], "explanation": "Intern = nur bei stehender Maschine möglich; extern = während der Produktion durchführbar.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 222, "nr": 222, "module": "Kapitel 10: Methoden des Lean Management", "question": "Welche typischen Verbesserungsideen nennt die Kursunterlage für SMED?", "src": "Lean Management S.50", "options": [{"key": "a", "text": "Klemmen statt Schrauben", "correct": true}, {"key": "b", "text": "Parallelisierung von Rüstvorgängen mit mehreren Mitarbeitenden", "correct": true}, {"key": "c", "text": "Separates Vorheizen", "correct": true}, {"key": "d", "text": "Mehr Schrauben für höhere Sicherheit", "correct": false}], "explanation": "Weitere: Schiebetische statt Kräne, Zwischenspannvorrichtungen, Eliminierung von Justierungen, Mechanisierung, Standardisierung.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 223, "nr": 223, "module": "Kapitel 10: Methoden des Lean Management", "question": "Welche „Nicht-Ziele“ nennt die Kursunterlage bei der SMED-Zieldefinition als Beispiele?", "src": "Lean Management S.42", "options": [{"key": "a", "text": "Keine Beschädigung von Produkten", "correct": true}, {"key": "b", "text": "Keine technischen Störungen aufgrund fehlerhaften Rüstens", "correct": true}, {"key": "c", "text": "Keine Verringerung der Sicherheit", "correct": true}, {"key": "d", "text": "Keine Reduktion der Rüstzeit", "correct": false}], "explanation": "Nicht-Ziele legen fest, was sich durch das Projekt nicht verschlechtern darf.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 224, "nr": 224, "module": "Kapitel 10: Methoden des Lean Management", "question": "Was bedeutet Poka Yoke wörtlich und wofür wird es verwendet?", "src": "Lean Management S.61", "options": [{"key": "a", "text": "Poka = „zufälliger, unbeabsichtigter Fehler“, Yoke = „Vermeidung, Verminderung“", "correct": true}, {"key": "b", "text": "Werkzeug zur Vermeidung bzw. Entdeckung zufälliger, vom Menschen verursachter Fehler", "correct": true}, {"key": "c", "text": "Werkzeug zur Berechnung der Prozessfähigkeit", "correct": false}, {"key": "d", "text": "Japanisch für „Karte“", "correct": false}], "explanation": "„Karte“ ist Kanban; Poka Yoke = Fehlhandlungssicherheit.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 225, "nr": 225, "module": "Kapitel 10: Methoden des Lean Management", "question": "Welche Beispiele gehören zum „harten“ Poka Yoke?", "src": "Lean Management S.64", "options": [{"key": "a", "text": "Formschluss", "correct": true}, {"key": "b", "text": "Bandstopp", "correct": true}, {"key": "c", "text": "Prüfung im Prozess mit Abschaltung", "correct": true}, {"key": "d", "text": "Farben und Checklisten", "correct": false}], "explanation": "Hart = Fehlervermeidung durch Technik; weich = Hinweis an Mitarbeitende (Farben, Checklisten, Leuchten, Hupen).", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 226, "nr": 226, "module": "Kapitel 10: Methoden des Lean Management", "question": "Beim Punktschweißen vergaßen Werker gelegentlich Schweißpunkte. Ein Zähler gibt die Spannzangen erst frei, wenn 10 Schweißungen erfolgt sind. Was ist das?", "src": "Lean Management S.68", "options": [{"key": "a", "text": "Ein Poka-Yoke-System (hartes Poka Yoke)", "correct": true}, {"key": "b", "text": "Ein weiches Poka Yoke", "correct": false}, {"key": "c", "text": "Eine 5S-Maßnahme", "correct": false}, {"key": "d", "text": "Eine SMED-Maßnahme", "correct": false}], "explanation": "Die Freigabe ist technisch an die richtige Anzahl gekoppelt – der Fehler wird verhindert.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 227, "nr": 227, "module": "Kapitel 10: Methoden des Lean Management", "question": "Was bedeutet „Führen mit Zielen“ laut Kursunterlage?", "src": "Lean Management S.72", "options": [{"key": "a", "text": "Es wird nicht vorgegeben, WAS zu tun ist, sondern WELCHE ZIELE zu erreichen sind", "correct": true}, {"key": "b", "text": "Weg und Mittel kann der Mitarbeitende (im Rahmen von Richtlinien) weitgehend selbst bestimmen", "correct": true}, {"key": "c", "text": "Führen mit Zielen braucht Feedback", "correct": true}, {"key": "d", "text": "Ziele werden 1:1 ohne Anpassung weitergereicht", "correct": false}], "explanation": "Ziele werden umformuliert und angepasst – niemand soll Ziele bekommen, die er nicht beeinflussen kann.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 228, "nr": 228, "module": "Kapitel 10: Methoden des Lean Management", "question": "Wofür steht SQCDP als Hilfe zur Zielableitung?", "src": "Lean Management S.74", "options": [{"key": "a", "text": "Safety (Sicherheit), Quality, Cost, Delivery, People", "correct": true}, {"key": "b", "text": "Sigma, Quality, Control, Design, Process", "correct": false}, {"key": "c", "text": "Speed, Quantity, Capability, Data, Performance", "correct": false}, {"key": "d", "text": "Standard, Quality, Cost, Development, Pull", "correct": false}], "explanation": "SQCDP strukturiert Kennzahlen und Ziele im Shopfloor Management.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 229, "nr": 229, "module": "Kapitel 10: Methoden des Lean Management", "question": "Welche Kriterien kennzeichnen laut Kursunterlage „gute“ Kennzahlen?", "src": "Lean Management S.79", "options": [{"key": "a", "text": "Ihre Verbesserung bewirkt eine Annäherung an den Idealzustand", "correct": true}, {"key": "b", "text": "Verständlichkeit und Interpretierbarkeit", "correct": true}, {"key": "c", "text": "Wirtschaftliche Erfassbarkeit und Beeinflussbarkeit", "correct": true}, {"key": "d", "text": "Möglichst viele Kennzahlen gleichzeitig", "correct": false}], "explanation": "Außerdem muss Verbesserungspotenzial vorhanden sein.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 230, "nr": 230, "module": "Kapitel 10: Methoden des Lean Management", "question": "Was sind die 4 Ziele des Shopfloor Managements?", "src": "Lean Management S.76", "options": [{"key": "a", "text": "Führung (vor Ort)", "correct": true}, {"key": "b", "text": "Visualisierung", "correct": true}, {"key": "c", "text": "Problemlösung und Kommunikation", "correct": true}, {"key": "d", "text": "Kontrolle per E-Mail („meet and mail“)", "correct": false}], "explanation": "Leitsatz: „go & see“ statt „meet and mail“.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 231, "nr": 231, "module": "Kapitel 10: Methoden des Lean Management", "question": "Was gilt laut Kursunterlage für Informationswände vor Ort?", "src": "Lean Management S.81", "options": [{"key": "a", "text": "Daten müssen aktuell sein", "correct": true}, {"key": "b", "text": "Sie werden von den Mitarbeitenden gepflegt (erhöht die Identifikation)", "correct": true}, {"key": "c", "text": "Vorsicht vor Übervisualisierung – weniger ist mehr", "correct": true}, {"key": "d", "text": "Sie hängen idealerweise im Büro der Geschäftsführung", "correct": false}], "explanation": "Die Informationswand gehört in den Arbeitsbereich.", "tags": ["Methoden des Lean Management"], "flags": []}, {"id": 232, "nr": 232, "module": "Kapitel 11: Control-Phase", "question": "Wozu dient die Control-Phase laut Kursunterlage?", "src": "Control S.2, S.4", "options": [{"key": "a", "text": "Die Maßnahmen werden auf Wirksamkeit geprüft und die Ergebnisse abgesichert", "correct": true}, {"key": "b", "text": "Erkenntnisse werden als Standard auf weitere Produkte, Prozesse oder Standorte übertragen („Transferpotenzial“)", "correct": true}, {"key": "c", "text": "Sie ist ein Überwachungswerkzeug für den Prozesseigner; das Projekt wird mit der Übergabe abgeschlossen", "correct": true}, {"key": "d", "text": "Hier werden erstmals die Ursachen gesucht", "correct": false}], "explanation": "In Control wird das in Measure als verbesserungswürdig erkannte y erneut gemessen.", "tags": ["Control-Phase"], "flags": []}, {"id": 233, "nr": 233, "module": "Kapitel 11: Control-Phase", "question": "Welche Soll-Ist-Vergleiche unterscheidet die Kursunterlage im Controlling?", "src": "Control S.6–S.7", "options": [{"key": "a", "text": "Maßnahmencontrolling: Wurden die Maßnahmen wie geplant und termingerecht umgesetzt?", "correct": true}, {"key": "b", "text": "Ursachencontrolling: Wurden die eigentlichen Ursachen nachweislich beseitigt?", "correct": true}, {"key": "c", "text": "Wirkungscontrolling: Wurde das Ziel y erreicht?", "correct": true}, {"key": "d", "text": "Lieferantencontrolling: Hat der Lieferant bezahlt?", "correct": false}], "explanation": "Dazu kommt die Nachkalkulation: Wurde das Einsparungsziel Y erreicht? (Backbone-Diagramm)", "tags": ["Control-Phase"], "flags": []}, {"id": 234, "nr": 234, "module": "Kapitel 11: Control-Phase", "question": "Wie wird das Wirkungscontrolling laut Kursunterlage durchgeführt?", "src": "Control S.8–S.9", "options": [{"key": "a", "text": "Neuerliche Datenerfassung von y nach denselben Kriterien", "correct": true}, {"key": "b", "text": "Soll-Ist-Vergleich, z. B. mit Liniendiagrammen, Pareto- und Balkendiagrammen", "correct": true}, {"key": "c", "text": "Eventuell mit Hypothesentests (t-Test, ANOVA) und Vorher/Nachher-Regelkarten", "correct": true}, {"key": "d", "text": "Nur durch Befragung der Mitarbeitenden", "correct": false}], "explanation": "Vorher/Nachher-Vergleiche erfolgen auch mit Prozessfähigkeitsanalysen.", "tags": ["Control-Phase"], "flags": []}, {"id": 235, "nr": 235, "module": "Kapitel 11: Control-Phase", "question": "Welche Reihenfolge gehört zu den Schritten der SPC-Methode?", "src": "Control S.13", "options": [{"key": "a", "text": "Merkmal und Messeinrichtung festlegen → Regelkartentyp wählen → Stichprobenumfang und -intervall festlegen → Vorlauf → Eingriffsgrenzen berechnen → Reaktionsplan → Regelkarte führen", "correct": true}, {"key": "b", "text": "Eingriffsgrenzen berechnen → Merkmal festlegen → Vorlauf → Regelkartentyp wählen", "correct": false}, {"key": "c", "text": "Regelkarte führen → Vorlauf → Merkmal festlegen → Reaktionsplan", "correct": false}, {"key": "d", "text": "Reaktionsplan → Eingriffsgrenzen → Merkmal festlegen → Stichprobenumfang", "correct": false}], "explanation": "Der Vorlauf dient der Bestimmung des Prozesstyps und der Grenzen.", "tags": ["Control-Phase"], "flags": []}, {"id": 236, "nr": 236, "module": "Kapitel 11: Control-Phase", "question": "Welche Regelkarten zählen laut Kursunterlage zu den zählenden (attributiven) Karten?", "src": "Control S.15", "options": [{"key": "a", "text": "p-Karte", "correct": true}, {"key": "b", "text": "u-Karte", "correct": true}, {"key": "c", "text": "x̄-Karte", "correct": false}, {"key": "d", "text": "s-Karte", "correct": false}], "explanation": "Messende Karten: Einzelwert-, x̄-, x̃-, s-, R- und MR-Karte.", "tags": ["Control-Phase"], "flags": []}, {"id": 237, "nr": 237, "module": "Kapitel 11: Control-Phase", "question": "Welche Muster auf einer Regelkarte deuten laut Kursunterlage auf eine Instabilität hin?", "src": "Control S.18–S.24", "options": [{"key": "a", "text": "„Run“: 7 aufeinanderfolgende Werte auf einer Seite der Mittellinie", "correct": true}, {"key": "b", "text": "„Trend“: 7 aufeinanderfolgende Werte in auf- bzw. absteigender Reihenfolge", "correct": true}, {"key": "c", "text": "Verletzung der Eingriffsgrenzen", "correct": true}, {"key": "d", "text": "Etwa 2/3 der Werte liegen im mittleren Drittel um den Mittelwert", "correct": false}], "explanation": "Die Middle-Third-Regel beschreibt den Normalfall (2/3 der Werte im mittleren Drittel); auffällig sind auch zu kleine Streuung, Sprünge und Zyklen.", "tags": ["Control-Phase"], "flags": []}, {"id": 238, "nr": 238, "module": "Kapitel 11: Control-Phase", "question": "Wofür dient die Mittelwertkarte (x̄-Karte)?", "src": "Control S.25", "options": [{"key": "a", "text": "Zur Überwachung der zentralen Tendenz eines Merkmals", "correct": true}, {"key": "b", "text": "Eingetragen wird das Stichprobenmittel aus Stichproben gleichen Umfangs n", "correct": true}, {"key": "c", "text": "Zur Überwachung des Fehleranteils p", "correct": false}, {"key": "d", "text": "Zur Überwachung von Einzelwerten mit n = 1", "correct": false}], "explanation": "Die x̄-Karte ist nur mäßig empfindlich gegenüber Abweichungen von der Normalverteilung.", "tags": ["Control-Phase"], "flags": []}, {"id": 239, "nr": 239, "module": "Kapitel 11: Control-Phase", "question": "Was ist eine Teilgruppe (rationale Untergruppe) laut Kursunterlage?", "src": "Control S.28", "options": [{"key": "a", "text": "Eine Teilmenge von Daten in einem Zeitintervall, in dem nur zufällige Einflüsse auftreten", "correct": true}, {"key": "b", "text": "Eine zufällige Auswahl über das ganze Jahr", "correct": false}, {"key": "c", "text": "Die Gruppe der Prüfer einer MSA", "correct": false}, {"key": "d", "text": "Alle Werte außerhalb der Eingriffsgrenzen", "correct": false}], "explanation": "Daten einer Teilgruppe sind frei von systematischen Einflüssen und zeigen die höchstmögliche Stabilität.", "tags": ["Control-Phase"], "flags": []}, {"id": 240, "nr": 240, "module": "Kapitel 11: Control-Phase", "question": "Welche Teilgruppengrößen empfiehlt die Kursunterlage?", "src": "Control S.29", "options": [{"key": "a", "text": "I-Karte: natürliche Stichprobengröße 1", "correct": true}, {"key": "b", "text": "Variable Karte (Mittelwerte): 5, wenn möglich", "correct": true}, {"key": "c", "text": "Attributive Karte: 30 oder mehr, abhängig vom Fehleranteil", "correct": true}, {"key": "d", "text": "Mittelwertkarte: immer 50", "correct": false}], "explanation": "Stichprobenhäufigkeit: nicht zu häufig (Kosten), aber je häufiger, desto höher die Interventionswahrscheinlichkeit.", "tags": ["Control-Phase"], "flags": []}, {"id": 241, "nr": 241, "module": "Kapitel 11: Control-Phase", "question": "Welche typischen „Außer-Kontrolle“-Regeln nennt die Kursunterlage?", "src": "Control S.31", "options": [{"key": "a", "text": "Ein Messpunkt außerhalb der 3-Sigma-Grenzen", "correct": true}, {"key": "b", "text": "Zwei von drei Punkten außerhalb der 2-Sigma-Grenzen", "correct": true}, {"key": "c", "text": "Vier von fünf Punkten außerhalb der 1-Sigma-Grenzen", "correct": true}, {"key": "d", "text": "Ein Punkt genau auf der Mittellinie", "correct": false}], "explanation": "Weiters: acht aufeinanderfolgende Messungen auf einer Seite der Mittellinie. Nur Regeln verwenden, auf die der Bediener reagieren kann.", "tags": ["Control-Phase"], "flags": []}, {"id": 242, "nr": 242, "module": "Kapitel 11: Control-Phase", "question": "Welche Aussagen zu den Eingriffs- und Warngrenzen sind richtig?", "src": "Control S.33", "options": [{"key": "a", "text": "Eingriffsgrenzen werden heute meist als 99,7 %-Zufallsstreubereich (±3σ) berechnet", "correct": true}, {"key": "b", "text": "Für Warngrenzen wird üblicherweise der 95 %-Zufallsstreubereich verwendet", "correct": true}, {"key": "c", "text": "Beim 99,7 %-Bereich beträgt die Irrtumswahrscheinlichkeit 0,3 %", "correct": true}, {"key": "d", "text": "Eingriffsgrenzen entsprechen den Toleranzgrenzen", "correct": false}], "explanation": "Prozessbezogene Grenzen werden aus einer Vorlaufstichprobe des stabilen Prozesses berechnet.", "tags": ["Control-Phase"], "flags": []}, {"id": 243, "nr": 243, "module": "Kapitel 11: Control-Phase", "question": "Eine I-Karte hat den Mittelwert X̄ = 75,82 und die +1SG-Linie bei 86,53. Wo liegt ungefähr die obere Eingriffsgrenze (OEG, +3σ)?", "src": "Control S.41 (Berechnung)", "options": [{"key": "a", "text": "Bei ca. 107,96", "correct": true}, {"key": "b", "text": "Bei ca. 97,24", "correct": false}, {"key": "c", "text": "Bei ca. 86,53", "correct": false}, {"key": "d", "text": "Bei ca. 118,7", "correct": false}], "explanation": "σ ≈ 86,53 − 75,82 = 10,71; OEG = 75,82 + 3·10,71 ≈ 107,96 (laut Grafik).", "tags": ["Control-Phase"], "flags": []}, {"id": 244, "nr": 244, "module": "Kapitel 11: Control-Phase", "question": "Wofür werden zweispurige Regelkarten (z. B. x̄/s-Karte) verwendet?", "src": "Control S.34", "options": [{"key": "a", "text": "Zur kombinierten Überwachung von Mittelwert und Streuung", "correct": true}, {"key": "b", "text": "Zur Überwachung zweier verschiedener Merkmale", "correct": false}, {"key": "c", "text": "Nur für attributive Daten", "correct": false}, {"key": "d", "text": "Zur Berechnung des Cg-Wertes", "correct": false}], "explanation": "Die obere Spur zeigt die Mittelwerte, die untere die Standardabweichungen der Stichproben.", "tags": ["Control-Phase"], "flags": []}, {"id": 245, "nr": 245, "module": "Kapitel 11: Control-Phase", "question": "Linie 2 im Bleistiftbeispiel hat Cp = 1,99 und Cpk = 0,37. Was ist die wahrscheinlichste Interpretation?", "src": "Control S.51", "options": [{"key": "a", "text": "Die Streuung ist klein, aber der Prozess ist stark außermittig (nicht zentriert)", "correct": true}, {"key": "b", "text": "Die Streuung ist sehr groß, der Prozess ist zentriert", "correct": false}, {"key": "c", "text": "Der Prozess ist sehr gut fähig", "correct": false}, {"key": "d", "text": "Cp und Cpk sind bei Linie 2 gleich", "correct": false}], "explanation": "Großer Unterschied zwischen Cp und Cpk → Mittelwertverschiebung; x̄ = 2,237 bei Sollwert 2,4.", "tags": ["Control-Phase"], "flags": []}, {"id": 246, "nr": 246, "module": "Kapitel 11: Control-Phase", "question": "Warum ist Standardisierung laut Kursunterlage wichtig?", "src": "Control S.54, S.56", "options": [{"key": "a", "text": "Sie stellt die Nachhaltigkeit der Lösung sicher", "correct": true}, {"key": "b", "text": "Sie reduziert Streuungen und erhöht die Voraussagbarkeit von Prozessergebnissen", "correct": true}, {"key": "c", "text": "Sie reduziert Kosten, z. B. durch kürzere Einarbeitungszeiten", "correct": true}, {"key": "d", "text": "Sie macht weitere Verbesserungen überflüssig", "correct": false}], "explanation": "Wichtig ist ein praktikabler Standardisierungsgrad – zu viel engt ein, zu wenig ermöglicht negative Ergebnisse.", "tags": ["Control-Phase"], "flags": []}, {"id": 247, "nr": 247, "module": "Kapitel 11: Control-Phase", "question": "Welche Anforderungen stellt die Kursunterlage an die Dokumentation bei der Standardisierung?", "src": "Control S.56", "options": [{"key": "a", "text": "Sie muss einen Nutzen bringen", "correct": true}, {"key": "b", "text": "Sie muss aktuell gehalten werden", "correct": true}, {"key": "c", "text": "Sie muss leicht verfügbar sein", "correct": true}, {"key": "d", "text": "Sie muss möglichst umfangreich sein", "correct": false}], "explanation": "Mitarbeitende werden zu Sinn und Zweck der Standardisierung geschult.", "tags": ["Control-Phase"], "flags": []}, {"id": 248, "nr": 248, "module": "Kapitel 11: Control-Phase", "question": "Was ist „Standardized Work“ laut Kursunterlage?", "src": "Control S.59", "options": [{"key": "a", "text": "Erfolgreiche Tätigkeiten werden standardisiert und unabhängig von Person und Zeit gleich ausgeführt", "correct": true}, {"key": "b", "text": "Sie ist Grundlage für einen kontinuierlichen Verbesserungsprozess", "correct": true}, {"key": "c", "text": "Eine Methode zur Verkürzung der Rüstzeit", "correct": false}, {"key": "d", "text": "Ein statistischer Test", "correct": false}], "explanation": "Alle Mitarbeitenden erhalten dadurch eine gleiche Informationsbasis.", "tags": ["Control-Phase"], "flags": []}, {"id": 249, "nr": 249, "module": "Kapitel 11: Control-Phase", "question": "Welche Bestandteile hat der Control Plan laut Kursunterlage?", "src": "Control S.62", "options": [{"key": "a", "text": "Qualitätsregelkarten und Reaktionspläne", "correct": true}, {"key": "b", "text": "Messsystemanalyse und Prozessfähigkeitsanalyse", "correct": true}, {"key": "c", "text": "Prozessdokumentation und Erfassungsblatt der Metriken", "correct": true}, {"key": "d", "text": "Ishikawa-Diagramm und Kräftefeldanalyse", "correct": false}], "explanation": "Ziel: beherrschte und fähige Prozesse durch Beobachtung des Outputs und Regelung der Inputs.", "tags": ["Control-Phase"], "flags": []}, {"id": 250, "nr": 250, "module": "Kapitel 11: Control-Phase", "question": "Was gilt für den Produktionslenkungsplan (Control Plan) am Projektende?", "src": "Control S.67", "options": [{"key": "a", "text": "Alle relevanten Variablen und Informationen werden darin überwacht", "correct": true}, {"key": "b", "text": "Er wird zusammen mit den Regelkarten an den Prozesseigner übergeben", "correct": true}, {"key": "c", "text": "Die x müssen gesteuert und das y überwacht werden", "correct": true}, {"key": "d", "text": "Er wird nach Projektabschluss archiviert und nicht mehr verwendet", "correct": false}], "explanation": "Der Plan enthält u. a. Prozessschritt, Parameter, Spezifikation, Messmethode, Stichprobe, Frequenz, Regelkarte und Reaktion.", "tags": ["Control-Phase"], "flags": []}, {"id": 251, "nr": 251, "module": "Kapitel 11: Control-Phase", "question": "Was gehört laut Kursunterlage zum Projektabschluss?", "src": "Control S.69–S.70", "options": [{"key": "a", "text": "Zusammenfassen der Lernerfahrungen (Arbeitsprozess, Teamarbeit, Ergebnisse)", "correct": true}, {"key": "b", "text": "Übergabe des Abschlussberichts an den Prozessverantwortlichen", "correct": true}, {"key": "c", "text": "Verantwortungsübergabe für Standardisierung und Monitoring", "correct": true}, {"key": "d", "text": "Auflösen der Dokumentation", "correct": false}], "explanation": "Dazu gehören eine Abschlusspräsentation (ca. 15 Min.) und die Kommunikation der Lerneffekte.", "tags": ["Control-Phase"], "flags": []}, {"id": 252, "nr": 252, "module": "Kapitel 11: Control-Phase", "question": "Welche Tipps gibt die Kursunterlage für Präsentationsfolien?", "src": "Control S.75", "options": [{"key": "a", "text": "Maximal 7 Punkte auf einer Folie", "correct": true}, {"key": "b", "text": "Bilder und farbliche Akzente unterstützen die Botschaften", "correct": true}, {"key": "c", "text": "Ganze Sätze sind nicht erforderlich", "correct": true}, {"key": "d", "text": "Möglichst Word- oder Excel-Dateien präsentieren", "correct": false}], "explanation": "Bei elektronischer Präsentation sind Bilder oder PowerPoint zu empfehlen, Word/Excel nur in Ausnahmen.", "tags": ["Control-Phase"], "flags": []}, {"id": 253, "nr": 253, "module": "Kapitel 11: Control-Phase", "question": "Wie soll man nach einer Präsentation auf Fragen und Feedback reagieren?", "src": "Control S.78", "options": [{"key": "a", "text": "Fragen sachlich beantworten", "correct": true}, {"key": "b", "text": "Feedback einholen, annehmen und sich bedanken", "correct": true}, {"key": "c", "text": "Nicht zu emotional reagieren und sich nicht verteidigen", "correct": true}, {"key": "d", "text": "Kritische Fragen ignorieren", "correct": false}], "explanation": "Zusätzlich eventuell Protokoll und Fotos der Flipcharts erstellen.", "tags": ["Control-Phase"], "flags": []}]}};

const byId=Object.fromEntries(DATA.questions.map(q=>[q.id,q]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function isCorrect(q,sel){const c=q.options.filter(o=>o.correct).map(o=>o.key).sort().join();return [...sel].sort().join()===c}
const $=h=>{document.getElementById('app').innerHTML=h};const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null;
function home(){const mods=[...new Set(DATA.questions.map(q=>q.module))];const nm=Object.keys(st.mist).length;
const ck=Object.keys(DATA.catalogs)[0];$(`<div class="card"><b>Übungsmodus</b><div class="seg" style="margin-top:6px"><button class="${KURS?'sec':''}" onclick="setSet('katalog')">📋 Prüfungsfragen (Katalog)</button><button class="${KURS?'':'sec'}" onclick="setSet('kurs')">📚 Kursunterlagen</button></div></div>
<div class="card"><input type="hidden" id="cat" value="${ck}"><b>${esc(DATA.catalogs[ck].label)}</b> <span class="small">(${DATA.questions.length} Fragen)</span><br><br><b>${KURS?'Kapitel':'Modul'}</b><select id="mod"><option value="">${KURS?'Alle Kapitel':'Alle Module'}</option>${mods.map(m=>`<option>${esc(m)}</option>`).join('')}</select>
<b>Modus</b><div class="seg"><label><input type="radio" name="mode" value="learn" checked>Lernmodus</label><label><input type="radio" name="mode" value="exam">Prüfungsmodus</label></div>
<b>Anzahl Fragen</b><div class="seg">${['all',10,20,30].map((n,i)=>`<label><input type="radio" name="n" value="${n}" ${i?'':'checked'}>${n=='all'?'Alle':n}</label>`).join('')}</div>
<button onclick="start()">Start</button><button class="sec" onclick="start(true)" ${nm?'':'disabled'}>Fehlertraining (${nm})</button><button class="sec" onclick="stats()">Statistik</button><button class="sec" onclick="ctrl()">🔍 Kontroll-Modus</button></div>
<div class="small">Bestanden ab 60 %. Eine Frage zählt nur, wenn exakt alle richtigen Antworten angekreuzt sind.</div>`)}
function start(mist){const cat=document.getElementById('cat').value,mod=document.getElementById('mod').value,mode=document.querySelector('[name=mode]:checked').value,n=document.querySelector('[name=n]:checked').value;
let ids=DATA.catalogs[cat].questionIds.filter(i=>!mod||byId[i].module===mod);if(mist)ids=ids.filter(i=>st.mist[cat+':'+i]!=null);
ids=shuffle(ids);if(n!=='all')ids=ids.slice(0,+n);if(!ids.length){alert('Keine Fragen für diese Auswahl.');return}
S={cat,mode:mist?'learn':mode,mist:!!mist,qs:ids.map(i=>({q:byId[i],opts:shuffle(byId[i].options),sel:[],done:false})),i:0};show()}
function show(){const it=S.qs[S.i],q=it.q;
$(`<div class="small">${esc(DATA.catalogs[S.cat].label)} · ${S.mist?'Fehlertraining':S.mode==='learn'?'Lernmodus':'Prüfungsmodus'} · Frage ${S.i+1}/${S.qs.length}</div><div class="bar"><div style="width:${100*S.i/S.qs.length}%"></div></div>
<div class="card"><div class="small">${esc(q.module)}</div><h3>${esc(q.question)}</h3>${it.opts.map(o=>`<label class="opt" id="o_${o.key}"><input type="checkbox" value="${o.key}" ${it.sel.includes(o.key)?'checked':''} ${it.done?'disabled':''}><span>${esc(o.text)}</span></label>`).join('')}
<div id="fb"></div></div><div id="btns"></div>`);
document.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{it.sel=[...document.querySelectorAll('input:checked')].map(x=>x.value)});
if(it.done)feedback();else document.getElementById('btns').innerHTML=S.mode==='learn'?`<button onclick="check()">Prüfen</button>`:`${S.i?'<button class="sec" onclick="S.i--;show()">Zurück</button>':''}<button onclick="next()">${S.i<S.qs.length-1?'Weiter':'Abgeben'}</button>`;
document.getElementById('btns').innerHTML+=`<button class="sec" onclick="if(confirm('Abbrechen?'))home()">Abbrechen</button>`}
function record(it){const k=S.cat+':'+it.q.id,ok=isCorrect(it.q,it.sel);it.ok=ok;const qs=st.qstat[it.q.id]||(st.qstat[it.q.id]={r:0,n:0});qs.n++;if(ok)qs.r++;
if(!ok)st.mist[k]=0;else if(st.mist[k]!=null){st.mist[k]++;if(st.mist[k]>=2)delete st.mist[k]}}
function check(){const it=S.qs[S.i];it.done=true;record(it);save();show()}
function feedback(){const it=S.qs[S.i];paint(it);document.getElementById('fb').innerHTML=expl(it);document.getElementById('btns').innerHTML=`<button onclick="next()">${S.i<S.qs.length-1?'Weiter':'Auswertung'}</button>`}
function paint(it,pre=''){it.q.options.forEach(o=>{const el=document.getElementById(pre+'o_'+o.key);if(!el)return;const s=it.sel.includes(o.key);el.classList.add(o.correct&&s?'ok':!o.correct&&s?'bad':o.correct?'miss':'x')})}
function expl(it){return `<p><b>${it.ok?'✅ Richtig':'❌ Falsch'}</b></p><p class="small">${esc(it.q.explanation)}</p>${it.q.src?`<p class="small">📄 Quelle: ${esc(it.q.src)}</p>`:''}${it.q.flags.map(f=>`<div class="flag">⚠️ Hinweis: ${esc(f)}</div>`).join('')}`}
function next(){if(S.i<S.qs.length-1){S.i++;show()}else finish()}
function finish(){if(S.mode==='exam')S.qs.forEach(record);const r=S.qs.filter(x=>x.ok).length,p=Math.round(100*r/S.qs.length),pass=p>=60;
st.history.unshift({d:new Date().toLocaleString('de-AT'),cat:DATA.catalogs[S.cat].label,mode:S.mist?'Fehler':S.mode==='learn'?'Lernen':'Prüfung',r,n:S.qs.length,p,pass});st.history=st.history.slice(0,100);save();
$(`<div class="card"><h2>${pass?'🎉 Bestanden':'Nicht bestanden'}</h2><p><b>${r} / ${S.qs.length}</b> richtig (${p} %) – Grenze 60 %</p><button onclick="home()">Zur Startseite</button></div>`+
(S.mode==='exam'?S.qs.map((it,n)=>`<div class="card"><div class="small">${n+1}. ${esc(it.q.module)}</div><b>${esc(it.q.question)}</b>${it.opts.map(o=>`<label class="opt" id="r${n}o_${o.key}"><span>${it.sel.includes(o.key)?'☑':'☐'} ${esc(o.text)}</span></label>`).join('')}${expl(it)}</div>`).join(''):''));
if(S.mode==='exam')S.qs.forEach((it,n)=>paint(it,'r'+n))}
function stats(){const h=st.history,ex=h.filter(x=>x.mode==='Prüfung'),mods={};
DATA.questions.forEach(q=>{const s=st.qstat[q.id];if(!s)return;const m=mods[q.module]||(mods[q.module]={r:0,n:0});m.r+=s.r;m.n+=s.n});
$(`<div class="card"><h3>Statistik</h3><p>Versuche: ${h.length} · Bestehensquote: ${h.length?Math.round(100*h.filter(x=>x.pass).length/h.length):0} % (Prüfungen: ${ex.length?Math.round(100*ex.filter(x=>x.pass).length/ex.length)+' %':'–'})</p>
<p>Offene Fehlerfragen: ${Object.keys(st.mist).length}</p><h4>Nach ${KURS?'Kapitel':'Modul'}</h4><table>${Object.entries(mods).map(([m,s])=>`<tr><td>${esc(m)}</td><td>${Math.round(100*s.r/s.n)} % (${s.r}/${s.n})</td></tr>`).join('')||'<tr><td>Noch keine Daten</td></tr>'}</table>
<h4>Verlauf</h4><table>${h.map(x=>`<tr><td>${x.d}</td><td>${esc(x.cat)}<br><span class="small">${x.mode}</span></td><td>${x.r}/${x.n} (${x.p} %) ${x.pass?'✅':'❌'}</td></tr>`).join('')}</table>
<button onclick="home()">Zurück</button><button class="sec" onclick="if(confirm('Alle Daten löschen?')){localStorage.removeItem('${LS}');location.reload()}">Zurücksetzen</button></div>`)}
const CK=KURS?'gbq_kurs_ctrl_v1':'gbq_ctrl_v1';const cs=JSON.parse(localStorage.getItem(CK)||'{}');const csave=()=>localStorage.setItem(CK,JSON.stringify(cs));
let CF={flag:false,q:''};
function ctrl(){const all=DATA.questions,ch=all.filter(q=>cs[q.id]&&cs[q.id].s).length,er=all.filter(q=>cs[q.id]&&cs[q.id].s==='err').length;
$(`<div class="card" style="position:sticky;top:0;z-index:2"><b>🔍 Kontroll-Modus</b> <span class="small">geprüft <b>${ch}/${all.length}</b> · Fehler <b style="color:#c62828">${er}</b></span>
<input id="cq" type="search" placeholder="Suche…" value="${esc(CF.q)}" style="font-size:16px;width:100%;padding:8px;margin:6px 0;border:1px solid #cfd9d2;border-radius:8px">
<div class="seg" style="margin:0"><label><input type="checkbox" id="cfl" ${CF.flag?'checked':''}>Nur ⚠️ markierte</label>
<input id="cj" type="number" min="1" max="${all.length}" placeholder="Nr." style="width:70px;font-size:16px;padding:6px"><button class="sec" onclick="jump()">Springe</button></div>
<button onclick="cexport()">Fehlerliste exportieren</button><button class="sec" onclick="home()">Zurück</button></div><div id="clist"></div>`);
document.getElementById('cq').oninput=e=>{CF.q=e.target.value;clist()};document.getElementById('cfl').onchange=e=>{CF.flag=e.target.checked;clist()};clist()}
function clist(){const s=CF.q.toLowerCase();const L=DATA.questions.filter(q=>(!CF.flag||q.flags.length)&&(!s||(q.nr+' '+q.question+' '+q.options.map(o=>o.text).join(' ')).toLowerCase().includes(s)));
document.getElementById('clist').innerHTML=L.map(q=>{const c=cs[q.id]||{};return `<div class="card" id="cq${q.id}" style="border-left:6px solid ${c.s==='ok'?'#1b7f3b':c.s==='err'?'#c62828':'#ccc'}">
<div class="small">Frage ${q.nr} · ${esc(q.module)}</div><b>${esc(q.question)}</b>
${q.options.map(o=>`<div class="opt ${o.correct?'ok':''}" style="display:flex;gap:8px;padding:10px;border:2px solid #dde5df;border-radius:10px;margin:6px 0"><span>${o.correct?'✅':'⬜'}</span><span><b>${o.key})</b> ${esc(o.text)}</span></div>`).join('')}
${q.explanation?`<div class="small">💡 ${esc(q.explanation)}</div>`:''}${q.src?`<div class="small">📄 Quelle: ${esc(q.src)}</div>`:''}${q.flags.map(f=>`<div class="flag">⚠️ ${esc(f)}</div>`).join('')}
<div><button class="${c.s==='ok'?'':'sec'}" onclick="cset(${q.id},'ok')">✓ Stimmt</button><button class="${c.s==='err'?'':'sec'}" style="${c.s==='err'?'background:#c62828':''}" onclick="cset(${q.id},'err')">✗ Fehler</button></div>
<textarea placeholder="Notiz (optional)" oninput="cnote(${q.id},this.value)" style="width:100%;font-size:16px;padding:8px;border-radius:8px;border:1px solid #cfd9d2">${esc(c.n||'')}</textarea></div>`}).join('')||'<div class="card">Keine Treffer.</div>'}
function cset(id,s){const c=cs[id]||(cs[id]={});c.s=c.s===s?undefined:s;csave();const y=scrollY;ctrl();scrollTo(0,y)}
function cnote(id,v){(cs[id]||(cs[id]={})).n=v;csave()}
function jump(){const q0=DATA.questions.find(q=>q.nr===+document.getElementById('cj').value);if(!q0)return;const n=q0.id;if(!document.getElementById('cq'+n)){CF={flag:false,q:''};ctrl()}const e=document.getElementById('cq'+n);if(e)e.scrollIntoView({behavior:'smooth'})}
function exportText(){const E=DATA.questions.filter(q=>cs[q.id]&&cs[q.id].s==='err');const ch=DATA.questions.filter(q=>cs[q.id]&&cs[q.id].s).length;
return `${DATA.catalogs[Object.keys(DATA.catalogs)[0]].label} – Kontrolle (${new Date().toLocaleString('de-AT')})\nGeprüft: ${ch}/${DATA.questions.length}, Fehler: ${E.length}\n\n`+E.map(q=>`Frage ${q.nr} (${q.module}${q.src?', Quelle: '+q.src:''}): ${q.question}\n`+q.options.map(o=>`  ${o.correct?'[x]':'[ ]'} ${o.key}) ${o.text}`).join('\n')+`\n  Notiz: ${(cs[q.id].n||'').trim()||'–'}\n`).join('\n')}
function cexport(){const t=exportText();if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('Fehlerliste kopiert – auch als Datei heruntergeladen.'),()=>{});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=KURS?'kursunterlagen-fehlerliste.txt':'green-belt-fehlerliste.txt';a.click()}
if(typeof document!=='undefined')home();
</script></body></html>
